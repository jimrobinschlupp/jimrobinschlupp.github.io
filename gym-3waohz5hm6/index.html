/* ============ helpers ============ */

const GYMS = ["Munich","Home","Soma Bay","Hurghada","Cairo","Other"];
/* GYMS is only the STARTING list, the same deal as PLANS further down: once the

const TAGS = ["Push","Pull","Legs","Upper","Lower","Full Body","Cardio","Other"];
const TC = {Push:"#ff7b5c",Pull:"#64b5ff",Legs:"#86e05c",Upper:"#ff8a3d",Lower:"#a78bfa","Full Body":"#f472b6",Cardio:"#34d399",Other:"#999"};
const fmtD = d => new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});

const tod = () => new Date().toISOString().split("T")[0];
const uid = () => "w"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function Spark({data}) {

  const ticks=[lo,(lo+hi)/2,hi];

}

const KEY = "jimsgym-v1";
const AKEY = "jimsgym-apikey";
const PKEY = "jimsgym-passkey";
const DKEY = "jimsgym-dirty";
const MKEY = "jimsgym-phoneview";
/* Device preferences (rest timer, landscape). Deliberately NOT part of the
   synced blob: they describe this device, not the training log, and keeping
   them out means the merge logic never has to reason about them. */
const PRKEY = "jimsgym-prefs";
const DEFAULT_PREFS = { restTimer: false, restSecs: 120, landscape: false, autoJump: true };
/* ids deliberately brought back on THIS device (an import) whose tombstones
   must be lifted at the next merge; cleared once that merge is published */
const RVKEY = "jimsgym-revive";

/* Which flavour of the app is this? The deploy script injects window.GYM_CONFIG.
   mode "private" saves to the server through /api/gym; anything else (the
   public demo, or opening this file directly) stays entirely in this browser.

   `name` and `accent` make the app somebody else's: the showcase's customizer
   writes them into a downloaded copy, and passes them as query params to
   preview live. Everything visual follows from those two values. */
const CFG = { mode: "demo", ...(window.GYM_CONFIG || {}) };
const IS_DEMO = CFG.mode !== "private";

/* A look saved on this device (DATA tab, MAKE IT YOURS). It sits between the
   built-in config and the query params: a downloaded copy starts out as
   whoever built it, this device can then rename and recolour it for good
   without downloading anything again, and the showcase's ?name/?accent
   preview still wins so it can demonstrate any look on top. */
const LKEY = "jimsgym-look";
const SAVED_LOOK = (() => {
  try { return JSON.parse(localStorage.getItem((IS_DEMO ? "demo:" : "") + LKEY) || "null"); }
  catch (e) { return null; }
})();
if (SAVED_LOOK) {
  if (typeof SAVED_LOOK.name === "string" && SAVED_LOOK.name.trim()) CFG.name = SAVED_LOOK.name.trim().slice(0, 18);
  if (/^#[0-9a-fA-F]{6}$/.test(SAVED_LOOK.accent || "")) CFG.accent = SAVED_LOOK.accent;
}
{
  const q = new URLSearchParams(location.search);
  if (q.get("name")) CFG.name = q.get("name").slice(0, 18);
  if (/^#[0-9a-fA-F]{6}$/.test(q.get("accent") || "")) CFG.accent = q.get("accent");
}

/* ---- the one colour the app is built out of ---- */
const DEFAULT_ACCENT = "#ffcc4d";
const ACCENT = /^#[0-9a-fA-F]{6}$/.test(CFG.accent || "") ? CFG.accent : DEFAULT_ACCENT;
/** the accent laid over the near-black background at `k` strength — every
    tinted panel, border and muted label in the app is one of these, so a
    custom accent recolours the whole thing coherently instead of leaving
    hard-coded yellows behind */
function mix(k) {
  const hex = ACCENT.slice(1);
  const c = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16));
  return "#" + c.map((v) => Math.round(12 + (v - 12) * k).toString(16).padStart(2, "0")).join("");
}
const A05 = mix(0.05), A10 = mix(0.10), A14 = mix(0.14),
      A20 = mix(0.20), A28 = mix(0.28), A52 = mix(0.52), A84 = mix(0.84);
/** how bright a colour reads (0 black, 1 white). The start button and the big
    action buttons put near-black text on the accent, so a very dark accent
    would be unreadable; the colour picker warns rather than forbids. */
function lumOf(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(v => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
/** the accent colours offered in MAKE IT YOURS: the default, then the tag
    colours the app already uses, so any pick sits in the same family */
const SWATCHES = ["#ffcc4d","#ff7b5c","#f472b6","#a78bfa","#64b5ff","#34d399","#86e05c","#e6e6e6"];

/* ---- whose gym is it ---- */
const OWNER = (CFG.name || "Jim").trim().slice(0, 18) || "Jim";
/** "Jim" → "JIM'S", "Chris" → "CHRIS'" */
const possOf = n => n.toUpperCase() + (/[sS]$/.test(n) ? "’" : "’S");
const OWNER_POSS = possOf(OWNER);
const APP_TITLE = OWNER + (/[sS]$/.test(OWNER) ? "’" : "’s") + " Gym";
const CUSTOMIZED = OWNER !== "Jim" || ACCENT.toLowerCase() !== DEFAULT_ACCENT;

/* When somebody has made this their own, the tab title, the home-screen name
   and the icon should be theirs too — otherwise a personalised copy still
   installs as "Jim's Gym" with my monogram on it. The icon is drawn here
   rather than shipped, so it always matches whatever accent they chose.
   Untouched copies keep the original artwork exactly as it is. */
if (CUSTOMIZED) {
  document.title = APP_TITLE;
  const initials = OWNER.split(/[\s-]+/).filter(Boolean).slice(0, 2)
    .map(w => w[0].toUpperCase()).join("") + "G";
  const icon = (px) => {
    const cv = document.createElement("canvas");
    cv.width = cv.height = px;
    const x = cv.getContext("2d");
    x.fillStyle = "#0c0c0c";
    x.fillRect(0, 0, px, px);
    x.fillStyle = ACCENT;
    x.textAlign = "center";
    x.textBaseline = "middle";
    let size = px * 0.44;
    x.font = `600 ${size}px 'DM Sans', -apple-system, system-ui, sans-serif`;
    // shrink until three-letter monograms still sit inside the safe area
    while (x.measureText(initials).width > px * 0.68 && size > 8) {
      size -= px * 0.02;
      x.font = `600 ${size}px 'DM Sans', -apple-system, system-ui, sans-serif`;
    }
    x.fillText(initials, px / 2, px / 2 + px * 0.02);
    return cv.toDataURL("image/png");
  };
  try {
    const i180 = icon(180), i512 = icon(512);
    document.querySelectorAll('link[rel="apple-touch-icon"],link[rel="icon"]')
      .forEach(l => (l.href = i180));
    document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute("content", APP_TITLE);
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#0c0c0c");
    const mf = {
      name: APP_TITLE, short_name: APP_TITLE, start_url: ".", scope: ".",
      display: "standalone", background_color: "#0c0c0c", theme_color: "#0c0c0c",
      orientation: "portrait",
      icons: [{ src: i512, sizes: "512x512", type: "image/png", purpose: "any maskable" }],
    };
    const link = document.querySelector('link[rel="manifest"]');
    if (link) link.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: "application/manifest+json" }));
  } catch (e) { /* canvas blocked — the app still works, just keeps its icon */ }
}
/* Opened as a downloaded file rather than served from the web — i.e. somebody
   took the app to keep. It behaves like the demo (local storage, own API key)
   but it is THEIR tracker, so it starts empty and RESET really empties it,
   instead of being preloaded with the showcase's sample sessions. */
const IS_DOWNLOADED = location.protocol === "file:";
const API = CFG.api || "/api/gym";
const COACH_API = CFG.coach || "/api/gym-coach";
/* Empty = no VIEW SOURCE button. It used to point at
   github.com/jimrobinschlupp/jrs-website, but that repo is PRIVATE (verified:
   the GitHub API 404s it unauthenticated and the account has no public repos),
   so the link was a dead end for every visitor. Put a URL back here the moment
   the source is genuinely published and the button returns on its own. */
const SOURCE_URL = "";

/* PHONE VIEW (desktop only, hidden on purpose). This app is built for a phone
   and never needs a desktop layout, but editing and previewing it on a laptop
   is easier inside a phone-sized column. There is deliberately no button:
   type the word "phone" anywhere outside a text field to toggle it, or add
   #phone to the URL. The choice sticks (localStorage) until toggled back.
   Only kicks in on a wide window, so nothing changes on an actual phone. */
const phoneViewOn = () => {
  try { return localStorage.getItem(MKEY) === "1"; } catch (e) { return false; }
};
function applyPhoneView(on) {
  try { on ? localStorage.setItem(MKEY, "1") : localStorage.removeItem(MKEY); } catch (e) {}
  // The "only on a wide window" part is a CSS media query, not a check here —
  // that way it also follows a window being resized, with no listener.
  document.documentElement.classList.toggle("phoneview", on);
}
if (location.hash.toLowerCase() === "#phone") applyPhoneView(true);
else applyPhoneView(phoneViewOn());
(() => {
  let typed = "";
  window.addEventListener("keydown", e => {
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1) return;
    typed = (typed + e.key.toLowerCase()).slice(-5);
    if (typed === "phone") { typed = ""; applyPhoneView(!phoneViewOn()); }
  });
})();

/* Demo data lives under its own localStorage names, so trying the demo on a
   device that also runs the private instance can never mix the two. */
const nsKey = k => IS_DEMO ? "demo:" + k : k;
const localGet = k => localStorage.getItem(nsKey(k));
const localSet = (k, v) => localStorage.setItem(nsKey(k), v);
const localDel = k => localStorage.removeItem(nsKey(k));

/* Server sync (private instance only). localStorage stays the cache and the
   offline fallback; the server copy is the one that survives a lost phone.
   Rules that keep data safe:
   - never POST before a GET has come back (real data or a genuine "empty"),
   - if server and local both have data after being apart, merge by workout id
     instead of overwriting either side,
   - a failed request never touches the local copy,
   - the "unsent local changes" flag survives closing the app (DKEY). */
const Remote = {
  enabled: !IS_DEMO,
  pass: "",
  status: "local",            // local | checking | synced | offline | denied
  seenServer: false,          // a GET succeeded (200/204) with this passphrase
  dirty: false,
  timer: null,
  retryTimer: null,
  passTimer: null,
  lastPull: 0,                // when the server was last read (staleness guard)
  /** Bumped every time the passphrase changes. A reply that belongs to an
      older attempt is ignored, so a slow rejection can never land on top of a
      newer success. Without this, typing a passphrase one letter at a time
      fires a check per keystroke; the wrong ones are answered late (the
      server delays rejections on purpose to slow guessing) and the last one
      to arrive would mark a perfectly good connection as rejected. */
  gen: 0,
  listeners: new Set(),
  onMerge: null,              // app hook: local copy was replaced → refresh state
  setStatus(s){ if (this.status !== s) { this.status = s; this.listeners.forEach(f => f(s)); } },
  headers(){ return { "Content-Type": "application/json", "x-gym-key": this.pass }; },
  active(){ return this.enabled && !!this.pass; },
  setPass(p){
    this.pass = p;
    try { p ? localStorage.setItem(PKEY, p) : localStorage.removeItem(PKEY); } catch (e) {}
    this.seenServer = false;
    this.gen++;
    clearTimeout(this.passTimer);
    if (!p) { this.setStatus("local"); return; }
    // wait for a pause in the typing rather than checking every letter
    this.setStatus("checking");
    this.passTimer = setTimeout(() => this.flush(true), 700);
  },
  async fetchServer(){        // → {kind:"data",text} | {kind:"empty"} | {kind:"denied"} | {kind:"down"}
    try {
      const r = await fetch(API, { headers: this.headers(), cache: "no-store" });
      if (r.status === 200) return { kind: "data", text: await r.text() };
      if (r.status === 204) return { kind: "empty" };
      if (r.status === 401) return { kind: "denied" };
      return { kind: "down" };
    } catch (e) { return { kind: "down" }; }
  },
  /** Merge two copies of the log so neither side's work is lost.
      Sessions are the union by id, with this device's copy winning for ids
      both sides have. Deletions travel as TOMBSTONES (`deleted`: id → when):
      a tombstoned id stays gone on every device instead of being resurrected
      by whichever stale copy still carries it. A session the user explicitly
      re-imported on this device (the revive list) beats an old tombstone. */
  merge(serverObj, localObj){
    const tombs = { ...(serverObj.deleted || {}), ...(localObj.deleted || {}) };
    let revived = {};
    try { revived = JSON.parse(localGet(RVKEY) || "{}"); } catch (e) {}
    for (const id in revived) delete tombs[id];
    // prune ancient tombstones so the blob never grows without bound
    const cutoff = Date.now() - 180 * 864e5;
    for (const id in tombs) { if (+new Date(tombs[id]) < cutoff) delete tombs[id]; }
    const lw = (localObj.workouts || []).filter(w => !tombs[w.id]);
    const lids = new Set(lw.map(w => w.id));
    const sw = (serverObj.workouts || []).filter(w => !lids.has(w.id) && !tombs[w.id]);
    const sc = serverObj.chat || [], lc = localObj.chat || [];
    /* Plans merge PER WORKOUT TYPE, each with its own timestamp. One stamp for
       the whole object looked simpler and quietly ate work: editing Legs here
       while another device edited Push meant one side's whole object won and
       the other's edit vanished. Reset writes null rather than deleting the
       key, so "back to the default" is itself a dated edit that survives a
       merge instead of being undone by the other side still holding a copy.
       Anything added to the data from here on has to be named in this return:
       it builds a fresh object, so an unlisted key is dropped at first merge. */
    const sp = serverObj.plans || {}, lp = localObj.plans || {};
    const sa = serverObj.plansAt || {}, la = localObj.plansAt || {};
    const plans = {}, plansAt = {};
    for (const t of new Set([...Object.keys(sp), ...Object.keys(lp)])) {
      const lt = la[t] || "", st = sa[t] || "";
      const mine = (t in lp) && (!(t in sp) || lt >= st);
      plans[t] = mine ? lp[t] : sp[t];
      const at = mine ? lt : st;
      if (at) plansAt[t] = at;
    }
    const newerPlans = Object.keys(plans).length ? plans : null;
    /* The location list merges as ONE list, newest stamp wins, unlike plans
       which merge per workout type. A plan has a natural key (the workout type)
       to merge on; a flat list of locations has none, so there is no honest way
       to tell a row somebody added from a row somebody else removed. The cost:
       if two devices both edit locations before either syncs, the older edit is
       lost. Reset writes null with a fresh stamp, same as plans, so "back to
       the defaults" survives instead of being undone by the other side. */
    const lg = localObj.gymsAt || "", sg = serverObj.gymsAt || "";
    const gymsMine = ("gyms" in localObj) && (!("gyms" in serverObj) || lg >= sg);
    const gymSide = gymsMine ? localObj : serverObj;
    const gymPatch = ("gyms" in gymSide)
      ? { gyms: gymSide.gyms, ...(gymSide.gymsAt ? { gymsAt: gymSide.gymsAt } : {}) }
      : {};
    return {

      activeId: localObj.activeId ?? null,
      deleted: tombs,

      ...gymPatch,

  },
  /** an import brought these ids back on purpose; lift their tombstones at
      the next merge (persisted so it survives a failed push + reload) */
  recordRevive(ids){
    try {
      const m = JSON.parse(localGet(RVKEY) || "{}");
      for (const id of ids) m[id] = 1;
      localSet(RVKEY, JSON.stringify(m));
    } catch (e) {}
  },
  /* Bumped on every local write. flush() records it before POSTing and only
     clears the dirty flag if it has not moved: otherwise an edit made WHILE
     the POST was in flight would be marked as published, the next pull would
     see itself as clean, and the server's older copy would overwrite the
     freshly typed value. That is how typed reps were vanishing. */
  rev: 0,
  markDirty(){ this.dirty = true; this.rev++; try { localSet(DKEY, "1"); } catch (e) {} },
  clearDirty(){ this.dirty = false; try { localDel(DKEY); } catch (e) {} },
  queue(){
    if (!this.active()) return;
    this.markDirty();
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 1000);
  },
  scheduleRetry(){ clearTimeout(this.retryTimer); this.retryTimer = setTimeout(() => this.flush(), 30000); },
  /* Only ONE flush may be in flight. Two overlapping ones each hold their own
     snapshot of the server, and the slower one finishes last and writes its
     older snapshot over the newer result: a plan edit that had already been
     published came back undone (reproduced, then fixed here). A flush asked
     for while another is running is remembered and run straight after.

     Deliberately NOT queue() for the re-run: queue() marks the device dirty,
     which would turn a harmless foreground pull into a phantom local edit. */
  busy: false,
  pending: false,
  async flush(pullOnly){
    if (this.busy) { this.pending = true; return; }
    this.busy = true;
    try { await this.run(pullOnly); }
    finally {
      this.busy = false;
      if (this.pending) {
        this.pending = false;
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.flush(), 250);
      }
    }
  },
  async run(pullOnly){
    if (!this.active()) return;
    // this attempt's ticket: if the passphrase changes while a request is in
    // flight, the reply belongs to a passphrase nobody is using any more
    const mine = this.gen;
    const stale = () => mine !== this.gen;
    // ALWAYS read before writing, not just on first contact: another device
    // (or another tab) may have pushed since this one last looked, and a
    // POST of a stale copy would wipe that work off the server. The merge
    // keeps both sides' sessions and honours deletions via tombstones.
    const got = await this.fetchServer();
    if (stale()) return;
    if (got.kind === "denied") { this.setStatus("denied"); return; }
    if (got.kind === "down") { this.setStatus("offline"); this.scheduleRetry(); return; }
    this.seenServer = true;
    this.lastPull = Date.now();
    if (got.kind === "data") {
      const localText = localGet(KEY);
      if (this.dirty && localText) {
        try {
          const merged = JSON.stringify(this.merge(JSON.parse(got.text), JSON.parse(localText)));
          if (merged !== localText) {
            localSet(KEY, merged);
            if (this.onMerge) this.onMerge(JSON.parse(merged));
          }
        } catch (e) {}
      } else {
        const localNow = localGet(KEY);
        if (got.text !== localNow) {
          localSet(KEY, got.text);
          if (this.onMerge) { try { this.onMerge(JSON.parse(got.text)); } catch (e) {} }
        }
      }
    } else if (localGet(KEY)) {
      this.markDirty();       // server is empty but this device has data → push it up
    }
    if (pullOnly && !this.dirty) { this.setStatus("synced"); return; }
    if (!this.dirty) { this.setStatus("synced"); return; }
    const text = localGet(KEY);
    if (!text) { this.clearDirty(); this.setStatus("synced"); return; }
    const revAtPost = this.rev;               // what this POST actually carries
    try {
      const r = await fetch(API, { method: "POST", headers: this.headers(), body: text });
      if (stale()) return;
      if (r.status === 401) { this.setStatus("denied"); return; }
      if (!r.ok) { this.setStatus("offline"); this.scheduleRetry(); return; }
      this.setStatus("synced");
      // Typing continued while this request was in flight, so what just went
      // up is already out of date. Stay dirty and push again; clearing here
      // would let the next pull overwrite the newer local copy.
      if (this.rev !== revAtPost) { this.queue(); return; }
      this.clearDirty();
      try { localDel(RVKEY); } catch (e) {}   // the revival has been published
    } catch (e) { if (!stale()) { this.setStatus("offline"); this.scheduleRetry(); } }
  },
};

const LS = {
  get: async k => {
    if (k === KEY && Remote.active()) {
      const got = await Remote.fetchServer();
      if (got.kind === "data") {
        Remote.seenServer = true;
        const localText = localGet(k);
        if (Remote.dirty && localText) {
          // this device has changes the server never saw → merge, keep both
          try {
            const merged = JSON.stringify(Remote.merge(JSON.parse(got.text), JSON.parse(localText)));
            localSet(k, merged);
            Remote.queue();
            Remote.setStatus("synced");
            return { value: merged };
          } catch (e) {}
        }
        localSet(k, got.text);
        Remote.setStatus("synced");
        return { value: got.text };
      }
      if (got.kind === "empty") {
        Remote.seenServer = true;
        Remote.setStatus("synced");
        if (localGet(k)) Remote.queue();   // migrate this device's data up
      }
      else if (got.kind === "denied") Remote.setStatus("denied");
      else { Remote.setStatus("offline"); Remote.scheduleRetry(); }
    }
    const v = localGet(k);
    if (v === null) throw new Error("missing");
    return { value: v };
  },
  set: async (k, v) => {
    localSet(k, v);
    if (k === KEY) Remote.queue();
    return { ok: true };
  },
  list: async pre => ({ keys: Object.keys(localStorage).filter(x => x.startsWith(nsKey(pre))).map(x => IS_DEMO ? x.slice(5) : x) })

/* Pill label: just the numbers. Notes are pulled out and shown under the row
   instead, so every pill stays short enough to read from across the gym. */
const pillLabel = s => s.type==="dropset"
  ? s.drops.map(d=>`${d.reps}×${d.weight}`).join(" › ")
  : `${s.reps}×${s.weight}`;

/* rank(set) -> null | "wNew" (heaviest ever) | "wTie" (matches that best
   again) | "rNew" (most reps yet at a weight already lifted before).
   Defined at module scope so React keeps one component type and never
   remounts the rows. */
const Pills = ({sets, rank}) => {
  /* A session abandoned mid-entry can still carry the waiting blank row,
     which would otherwise render as a bare "×" pill. */
  sets = (sets||[]).filter(s => s.type==="dropset" || String(s.reps||"").trim() || String(s.weight||"").trim());
  if (!sets.length) return null;
  return (<>
  <span style={S.pillRow}>
    {sets.map((s,i)=>{
      const r = s.type==="dropset" ? null : (rank ? rank(s) : null);
      const st = s.type==="dropset" ? S.pillDrop
        : r==="wNew" ? S.pillPR : r==="rNew" ? S.pillReps : r==="wTie" ? S.pillTie : S.pill;
      return <span key={i} style={st}>{pillLabel(s)}</span>;
    })}
  </span>
  {setNotes(sets) && <span style={S.pillNote}>{setNotes(sets)}</span>}
</>);
};

    const prior = getHist(name, gym).filter(h => h.date < beforeDate);

  const pushEx = (wid,name)=>{ if(!name)return; mut(wid,w=>({...w,exercises:[...w.exercises,{name,sets:[{type:"normal",weight:"",reps:"",note:""}],done:false}]})); };

    if (!coachReady || !logged.length) return;

        .sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3)
        .map(x=>`${x.date} (${x.gym}): `+x.exercises.map(e=>`${e.name} ${e.sets.map(setStr).join(", ")}`).join(" | ")).join("\n")

      .map(t=>`${t}: ${planShown(data,t).join(", ")}`).join("\n");
    return `${COACH_CONTEXT}\n\nPLANS AS SET IN THE APP RIGHT NOW (these override the CURRENT PLANS above):\n${plans}\nLOCATIONS AS SET IN THE APP RIGHT NOW (the first is the usual one): ${gymList.join(", ")}\n\nTODAY: ${tod()} (${new Date().toLocaleDateString("en-GB",{weekday:"long"})})\nMUNICH PRs (max weight): ${prs}\nLAST 5 SESSIONS:\n${recent}\nLOGGED TODAY SO FAR:\n${today}`;
  };

  const applyLog = (tag, log) => {
    if (!log?.length) return;
    upd(d => {
      let ws = [...d.workouts];
      let t = ws.find(w=>w.date===tod());
      if (!t) { t = {id:uid(),date:tod(),tag:tag||"Other",gym:lastGym,note:"",exercises:[]}; ws.push(t); }
      else if (tag && t.tag==="Other") t = {...t, tag};
      let exs = [...t.exercises];
      for (const item of log) {
        const sets = item.dropset
          ? [{type:"dropset",note:"",drops:(item.sets||[]).map(s=>({reps:String(s.reps||""),weight:String(s.weight||"")}))}]
          : (item.sets||[]).map(s=>({type:"normal",reps:String(s.reps||""),weight:String(s.weight||""),note:s.note||""}));
        const i = exs.findIndex(e=>e.name.toLowerCase()===String(item.exercise).toLowerCase());
        if (i>=0) exs[i] = {...exs[i], sets:[...exs[i].sets, ...sets]};
        else exs.push({name:item.exercise, sets});
      }
      t = {...t, exercises:exs};
      ws = ws.map(w=>w.id===t.id?t:w);
      return {...d, workouts:ws};
    });
  };

  const sendChat = async () => {
    const text = chatInput.trim(); if (!text || coachBusy) return;
    if(!coachReady){ setView("data"); setIoMsg(IS_DEMO ? "Add an API key below to use the coach." : "Enter your passphrase (or an API key) below to use the coach."); return; }
    setChatInput("");
    const hist = [...(data.chat||[]), {role:"user", content:text}].slice(-30);
    upd(d=>({...d, chat:hist}));
    setCoachBusy(true);
    try {
      const res = await coachFetch({ model:"claude-sonnet-4-6", max_tokens:1000,
          system: buildContext(),
          messages: hist.map(m=>({role:m.role, content:m.content})) });
      if (!res.ok) throw new Error("coach " + res.status);   // an error reply must not read as success
      const out = await res.json();
      const raw = (out.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
      let reply = raw, tag = null, log = [];
      try { const p = JSON.parse(raw.replace(/```json|```/g,"").trim()); reply = p.reply||raw; tag = p.tag||null; log = p.log||[]; } catch(e){}
      applyLog(tag, log);
      upd(d=>({...d, chat:[...(d.chat||[]), {role:"assistant", content:reply, logged: log.length}].slice(-30)}));
    } catch (e) {
      upd(d=>({...d, chat:[...(d.chat||[]), {role:"assistant", content:"Could not reach the coach. Check your connection and try again.", logged:0}].slice(-30)}));
    }
    setCoachBusy(false);
  };

  /* render */
  const sorted = [...data.workouts].filter(w=>(fTag==="All"||w.tag===fTag)&&(fGym==="All"||w.gym===fGym)).sort((a,b)=>b.date.localeCompare(a.date));
  const Suggest = ({value,onPick}) => { const q=value.trim().toLowerCase(); if(!q) return null;
    const m=allNames.filter(n=>n.toLowerCase().includes(q)&&n.toLowerCase()!==q).slice(0,6);
    return m.length? <div style={S.sugList}>{m.map(n=><div role="button" key={n} onClick={()=>onPick(n)} style={S.sugItem}>{n}</div>)}</div> : null; };
  const wo = active?gw(active):null;
  let sc = 0;

  const chartData = statsEx ? getHist(statsEx, statsGym).filter(h=>h.maxWeight>0).map(h=>({date:h.date.slice(5), w:h.maxWeight, gym:h.gym})) : [];

  /* A running workout owns the screen: wordmark, session count and rest timer
     all go, and the CANCEL/FINISH row at the top of the content becomes the
     first thing you see. The header is what carries the safe-area TOP inset,
     so when it is not rendered the body has to carry it instead, or the
     content slides up under the Dynamic Island. */
  const training = view==="workout" && !!data.activeId;
  return (
    <div style={S.root}><style>{CSS}</style>
      <div className="rotgate">
        <p style={{fontSize:15,fontWeight:700,color:"#eee",letterSpacing:"0.04em"}}>Turn back to portrait</p>
        <p style={{fontSize:13,color:"#9a9a9a",lineHeight:1.6,maxWidth:280}}>This tracker is built for one hand, upright. You can allow landscape in the DATA tab under Settings.</p>
      </div>
      {!training && (<div style={S.hdr}>
        <div style={S.hdrTop}>
          <div><h1 style={S.logo}>{OWNER_POSS}<span style={{color:ACCENT}}> GYM</span></h1><p style={S.tag2}>{data.workouts.length} sessions{IS_DEMO?"  ·  demo":""}{storageOk?"":"  ·  memory only, storage unavailable"}{!IS_DEMO&&(sync==="offline"?"  ·  offline, saving locally":sync==="denied"?"  ·  passphrase rejected, saving locally":sync==="local"?"  ·  this device only":"")}</p></div>
        </div>
      </div>)}
      <div style={training?{...S.body,paddingTop:"calc(16px + var(--gp-safe-top, env(safe-area-inset-top)))"}:S.body}>
      {loadWarn && <div style={S.warnBox}>Storage could not be read on launch, so this is showing the built-in starting data. Your saved sessions were not overwritten. Close and reopen the app to try loading them again.</div>}

      {/* ---------- WORKOUT ---------- */}
      {view==="workout" && (()=>{ const aw = data.activeId ? gw(data.activeId) : null;
        if (!aw) {
          const recent=[...data.workouts].filter(w=>!wTag||w.tag===wTag).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,2);
          return (<>
            {justFinished && (()=>{ const fw = gw(justFinished); if(!fw) return null; return (
              <div style={S.doneBox}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                  <span style={S.doneTtl}>{fw.tag.toUpperCase()} DONE  ·  {fw.exercises.length} exercise{fw.exercises.length===1?"":"s"}{durMin(fw)?`  ·  ${fmtDur(durMin(fw))}`:""}</span>
                  <div role="button" onClick={()=>setJustFinished(null)} style={S.doneX}>✕</div>
                </div>
                {sessBusy && <div style={S.fbBox}>coach is looking at the session...</div>}
                {!sessBusy && fw.sessionFb && <div style={S.fbBox}>{fw.sessionFb}
                  <div role="button" style={S.fbReply} onClick={()=>{upd(d=>({...d,chat:[...(d.chat||[]),{role:"assistant",content:fw.sessionFb,logged:0}].slice(-30)}));setJustFinished(null);setView("coach");}}>reply in coach →</div></div>}
              </div>); })()}
            {data.workouts.length===0 && <div style={S.planBox}><p style={S.planLine}>{IS_DEMO?"Welcome! This is a live demo, so everything you log stays in your own browser. Pick a workout type below and log your first set.":"No history yet. Open the DATA tab to restore your backup, or just start a workout."}</p></div>}            {/* Three pills split the row evenly. Expanded, they keep their own
                width and the row scrolls sideways instead of squashing them.
                A tag picked from the extras stays on show once collapsed. */}
            {(()=>{const top=["Push","Pull","Legs"];
              const show=[...top,...(moreTags?TAGS.slice(3):(wTag&&!top.includes(wTag)?[wTag]:[]))];
              const wide=show.length>top.length;
              return (<div style={S.typeRow}>
                <div ref={typeRowRef} className="hscroll" style={S.typeScroll}>
                  {show.map(t=>(<div role="button" key={t} onClick={()=>setWTag(wTag===t?null:t)} style={{...S.typeBig,...(wide?S.typeBigAuto:null),borderColor:TC[t]+(wTag===t?"":"55"),color:TC[t],background:wTag===t?TC[t]+"22":"transparent"}}>{t}</div>))}
                </div>
                <div role="button" onClick={()=>setMoreTags(m=>!m)} style={S.fBtn}>{moreTags?"‹":"›"}</div>
              </div>);})()}
            {/* Collapsed, the row shows the first location plus the picked one
                if that is not it, the same way the workout types behave. The
                list comes from the editable locations, so a location added in
                DATA is pickable here straight away. */}
            {(()=>{const head=gymPick.slice(0,1);
              const show=moreGyms?gymPick:[...head,...(head.includes(wGymOk)?[]:[wGymOk])];
              return (<div style={S.fRow}>
                {show.map(g=>(<div role="button" key={g} onClick={()=>setWGym(g)} style={{...S.fBtn,...(wGymOk===g?{background:"#1d2430",borderColor:"#64b5ff",color:"#64b5ff"}:{})}}>{g}</div>))}
                {gymPick.length>1 && <div role="button" onClick={()=>setMoreGyms(m=>!m)} style={S.fBtn}>{moreGyms?"‹":"›"}</div>}
              </div>);})()}
            <div role="button" onClick={startWorkout} style={{...S.bigStart,...(wTag?{}:{background:"#1a1a1a",color:"#8a8a8a",border:"1px solid #252525"})}}>{wTag?`START ${wTag.toUpperCase()} · ${wGymOk.toUpperCase()}`:"PICK A WORKOUT TYPE"}</div>
            {wTag&&hasPlan(data,wTag)&&(<div style={S.planBox}><p style={S.newL}>{wTag.toUpperCase()} PLAN</p>
              {planShown(data,wTag).map((l,i)=><p key={i} style={S.planLine}>{i+1}. {l}</p>)}</div>)}
            <p style={S.secT}>LAST {wTag?wTag.toUpperCase()+" ":""}SESSIONS</p>
            {recent.map(w=>(<div key={w.id} style={S.card} onClick={()=>{setView("log");setActive(w.id);}}>
              <div style={S.cTop}><div><span style={{...S.cTag,color:TC[w.tag]||"#999",borderColor:(TC[w.tag]||"#999")+"44"}}>{w.tag}</span><span style={S.cDate}>{isApprox(w)?"~ ":""}{fmtDF(w.date)}</span><span style={S.cGym}>{w.gym}</span>{durMin(w)&&<span style={S.durChip}>{fmtDur(durMin(w))}</span>}</div></div>
              {w.exercises.map((e,i)=><div key={i} style={S.exLine}><span style={S.exLineNm}>{e.name}</span>
                <Pills sets={e.sets} rank={rankerFor(e.name, w.gym, w.date)}/></div>)}
              {w.exercises.length===0&&<span style={{fontSize:12,color:"#8a8a8a"}}>Light session, no tracking</span>}
            </div>))}
          </>);
        }
        const sugg = suggestNext(aw.tag, aw.gym, aw.exercises.map(e=>e.name));
        /* While an exercise is still open you are mid-set, so the NEXT UP
           suggestions are noise. They come back the moment everything is
           ticked off; the search field below stays available throughout. */
        const openEx = aw.exercises.some(e=>!e.done);
        return (<>
          <div style={S.eHdr}><span style={{...S.eTag,color:TC[aw.tag]}}>{aw.tag} · {aw.gym}</span>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              {prefs.restTimer && <div role="button" onClick={startTimer} style={{...S.timerBtn,...(timer>0?{borderColor:ACCENT,color:ACCENT}:{})}}>{timer>0?fmtSecs(timer):"REST "+fmtSecs(prefs.restSecs||120)}</div>}
              {confirmDel==="can:"+aw.id
                ? <div role="button" onClick={()=>{upd(d=>({...d,activeId:null,workouts:d.workouts.filter(w=>w.id!==aw.id)}));setConfirmDel(null);}} style={{...S.wConfirm,borderColor:"#a33333",background:"#2a1212",color:"#f88"}}>Discard?</div>
                : <div role="button" onClick={()=>{setConfirmDel("can:"+aw.id);setTimeout(()=>setConfirmDel(c=>c==="can:"+aw.id?null:c),4000);}} style={{...S.wBtn,borderColor:"#4a2626",color:"#e06a6a"}} aria-label="Cancel workout">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>}
              {confirmDel==="fin:"+aw.id
                ? <div role="button" onClick={()=>{finishWorkout(aw.id);setConfirmDel(null);}} style={{...S.wConfirm,borderColor:"#3f8f4f",background:"#142a18",color:"#7fd68f"}}>Finish?</div>
                : <div role="button" onClick={()=>{setConfirmDel("fin:"+aw.id);setTimeout(()=>setConfirmDel(c=>c==="fin:"+aw.id?null:c),4000);}} style={{...S.wBtn,borderColor:"#2f6b3c",color:"#6fc880"}} aria-label="Finish workout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg></div>}
            </div></div>
          {aw.exercises.map((ex,ei)=>{ const k=aw.id+":"+ei;
            if (ex.done) return (<div key={ei} style={S.card}>
              <div style={S.exLine}><span style={S.exLineNm}>{ex.name}</span>
                <Pills sets={ex.sets} rank={rankerFor(ex.name, aw.gym, aw.date)}/></div>
              {fbBusy===k&&<div style={S.fbBox}>coach is looking...</div>}
              {ex.fb&&<div style={S.fbBox}>{ex.fb}
                <div role="button" style={S.fbReply} onClick={()=>{upd(d=>({...d,chat:[...(d.chat||[]),{role:"assistant",content:`[${ex.name}] ${ex.fb}`,logged:0}].slice(-30)}));setView("coach");}}>reply in coach →</div></div>}
            </div>);
            const le = lastEntry(ex.name, aw.gym, aw.date); let n=0;
            return (<div key={ei} style={S.exCard}>
              <div style={S.exHd}><h3 style={S.exNm}>{ex.name}</h3></div>
              {le&&<div style={{marginBottom:10}}>
                <span style={{...S.lastMeta,fontSize:13,display:"block",marginBottom:6}}>last ({fmtD(le.date)}{le.gym!==aw.gym?", "+le.gym:""}):</span>
                <Pills sets={le.sets} rank={rankerFor(ex.name, le.gym, le.date)}/>
              </div>}
              {ex.sets.map((s,si)=> s.type==="dropset"
                ? <p key={si} style={S.lastRef}>dropset: {setStr(s)}</p>
                : (<div key={si} style={S.sRow}>
                    {setFilled(s)
                      ? <div role="button" onClick={()=>repeatSet(aw.id,ei,si)} style={S.sNumBtn} aria-label={`Repeat set ${n+1}`}>{++n}</div>
                      : <span style={S.sNum}>{++n}</span>}
                    <input {...numProps(`${aw.id}:${ei}:${si}`, s.reps, "reps", v=>updSetIn(aw.id,ei,si,"reps",v), focusNextNum, 2)} style={S.sIn}/><span style={S.sX}>×</span>
                    <input {...numProps(`${aw.id}:${ei}:${si}:w`, s.weight, "kg", v=>updSetIn(aw.id,ei,si,"weight",v), focusNextNum, weightDigits(ex.name, aw.gym))} style={S.sIn}/>
                    <input {...noteProps(`${aw.id}:${ei}:${si}:n`, s.note, v=>updSetIn(aw.id,ei,si,"note",v), 1.4)}/>
                    <div role="button" onClick={()=>rmSetIn(aw.id,ei,si)} style={S.sDel}>-</div></div>))}
              <div style={S.addRow2}>
                <div role="button" onClick={()=>addSetIn(aw.id,ei)} style={S.asBtn}>+ Set</div>
                <div role="button" onClick={()=>doneEx(aw.id,ei)} style={S.doneBtn}>Exercise done <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{marginLeft:6}}><path d="M4 12.5l5.5 5.5L20 6.5"/></svg></div>
              </div>
            </div>);})}
          {/* the day's plan, so the rest of the session is visible without
              leaving the workout */}
          {hasPlan(data,aw.tag) && (<div style={{...S.planBox,marginTop:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
              <p style={S.newL}>{aw.tag.toUpperCase()} PLAN</p>
              <div role="button" onClick={()=>{setPlanTag(aw.tag);setView("data");}} style={S.planEdit}>edit →</div>
            </div>
            {planShown(data,aw.tag).map((l,i)=>{ const st = planState(aw, l); return (
              <div key={i} style={S.planRow}>
                <span style={{...S.planTick,...(st==="done"?S.planTickDone:st==="doing"?S.planTickNow:{})}}>{st==="done"?"✓":i+1}</span>
                <span style={{
                  color: st==="done" ? "#8a8a8a" : st==="doing" ? ACCENT : "#c8c8c8",
                  fontWeight: st==="doing" ? 600 : 400,
                  textDecoration: st==="done" ? "line-through" : "none",
                }}>{l}</span>
              </div>); })}
          </div>)}
          {!openEx && sugg.length>0 && (<>
            <p style={{...S.newL,marginTop:6}}>NEXT UP</p>
            <div style={S.fRow}>{sugg.map(nm=>(<div role="button" key={nm} onClick={()=>pushEx(aw.id,nm)} style={S.sugChip}>+ {nm}</div>))}</div>
          </>)}
          <div style={{display:"flex",gap:8}}>
            <input value={wAdd} onChange={e=>setWAdd(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&wAdd.trim()){pushEx(aw.id,wAdd.trim());setWAdd("");}}} placeholder="Add other exercise..." style={{...S.nIn,marginBottom:0,flex:1}}/>
            <div role="button" onClick={()=>{if(wAdd.trim()){pushEx(aw.id,wAdd.trim());setWAdd("");}}} style={{...S.addExBtn,opacity:wAdd.trim()?1:0.4}}>ADD</div>
          </div>
          <Suggest value={wAdd} onPick={n=>{pushEx(aw.id,n);setWAdd("");}}/>
        </>);
      })()}

      {/* ---------- LOG ---------- */}
      {view==="log" && !active && (<>
        <div style={S.fRow}>
          {(()=>{const rest=TAGS.slice(3);const show=["All","Push","Pull","Legs",...(moreTags?rest:rest.filter(t=>t===fTag))];
            return show.map(t=>(<div role="button" key={t} onClick={()=>setFTag(t)} style={{...S.fBtn,...(fTag===t?{background:t==="All"?"#333":TC[t]+"22",borderColor:t==="All"?"#555":TC[t],color:t==="All"?"#ddd":TC[t]}:{})}}>{t}</div>));})()}
          <div role="button" onClick={()=>setMoreTags(m=>!m)} style={S.fBtn}>{moreTags?"‹":"›"}</div>
        </div>
        <div style={S.fRow}>
          {(()=>{const rest=["Home","Soma Bay","Hurghada","Cairo","Other"];const show=["All","Munich",...(moreGyms?rest:rest.filter(g=>g===fGym))];
            return show.map(g=>(<div role="button" key={g} onClick={()=>setFGym(g)} style={{...S.fBtn,...(fGym===g?{background:"#1d2430",borderColor:"#64b5ff",color:"#64b5ff"}:{})}}>{g}</div>));})()}
          <div role="button" onClick={()=>setMoreGyms(m=>!m)} style={S.fBtn}>{moreGyms?"‹":"›"}</div>
        </div>
        <div style={S.newS}><p style={S.newL}>NEW WORKOUT · {lastGym}</p><div style={S.tGrid}>
          {(moreNew?TAGS:TAGS.slice(0,3)).map(t=>(<div role="button" key={t} onClick={()=>createW(t)} style={{...S.tBtn,borderColor:TC[t]+"66",color:TC[t]}}>+ {t}</div>))}
          <div role="button" onClick={()=>setMoreNew(m=>!m)} style={{...S.tBtn,borderColor:"#2a2a2a",color:"#9a9a9a"}}>{moreNew?"‹":"›"}</div>
        </div></div>
        {(()=>{let dv=false;return sorted.flatMap(w=>{const out=[];
          if(!dv&&isApprox(w)){dv=true;out.push(
            <div key="dv" style={S.divide}>
              <span style={S.divideTxt}>DATES BELOW ARE APPROXIMATE</span>
              <p style={S.divideSub}>Imported from chat history, these dates skew a few days too early (the "Jul 8" pull day was closer to Jul 15). Order and content are correct. Dates above this line are accurate.</p>
            </div>);}
          out.push(
          <div key={w.id} style={S.card} onClick={()=>setActive(w.id)}>
            <div style={S.cTop}><div><span style={{...S.cTag,color:TC[w.tag]||"#999",borderColor:(TC[w.tag]||"#999")+"44"}}>{w.tag}</span><span style={S.cDate}>{isApprox(w)?"~ ":""}{fmtDF(w.date)}</span><span style={S.cGym}>{w.gym}</span>{durMin(w)&&<span style={S.durChip}>{fmtDur(durMin(w))}</span>}</div>
            {confirmDel===w.id
              ? <div role="button" onClick={e=>{e.stopPropagation();deleteW(w.id);setConfirmDel(null);}} style={S.cDelConfirm}>Delete?</div>
              : <div role="button" onClick={e=>{e.stopPropagation();setConfirmDel(w.id);setTimeout(()=>setConfirmDel(c=>c===w.id?null:c),4000);}} style={S.cDel}>✕</div>}</div>
            {w.note&&<p style={S.cNote}>{w.note}</p>}
            {fTag==="All"
              ? <div style={S.cExL}>{w.exercises.map((ex,j)=>(<span key={j} style={S.cEx}>{ex.name}<span style={S.cExS}>{ex.sets.length}</span></span>))}</div>
              : <div>{w.exercises.map((ex,j)=>(<div key={j} style={S.exLine}><span style={S.exLineNm}>{ex.name}</span>
                  <Pills sets={ex.sets} rank={rankerFor(ex.name, w.gym, w.date)}/></div>))}</div>}
            {w.exercises.length===0&&<span style={{fontSize:12,color:"#8a8a8a"}}>Light session, no tracking</span>}
          </div>);
          return out;});})()}
      </>)}

      {view==="log" && wo && (()=>{ 
        const prev = [...data.workouts].filter(w=>w.tag===wo.tag && w.id!==wo.id && w.date<=wo.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
        return (<>
        <div role="button" onClick={()=>setActive(null)} style={S.back}>← Sessions</div>
        <div style={S.eHdr}><span style={{...S.eTag,color:TC[wo.tag]}}>{wo.tag}</span>
          <div style={{display:"flex",gap:6}}>
            <input type="date" value={wo.date} onChange={e=>setWorkoutDate(wo.id,e.target.value)} style={S.dIn}/>
            <select value={wo.gym} onChange={e=>uw(wo.id,{gym:e.target.value})} style={S.tSel}>{(wo.gym&&!gymList.includes(wo.gym)?[...gymList,wo.gym]:gymList).map(g=><option key={g}>{g}</option>)}</select>
            <select value={wo.tag} onChange={e=>uw(wo.id,{tag:e.target.value})} style={S.tSel}>{TAGS.map(t=><option key={t}>{t}</option>)}</select>
          </div>
        </div>
        <input type="text" value={wo.note} onChange={e=>uw(wo.id,{note:e.target.value})} placeholder="Session notes..." style={S.nIn}/>
        {wo.sessionFb && <div style={{...S.fbBox,marginTop:0,marginBottom:12}}>{wo.sessionFb}</div>}
        {prev && wo.exercises.length===0 && (
          <div style={S.prevBox}><p style={S.newL}>LAST {wo.tag.toUpperCase()} · {fmtD(prev.date)} · {prev.gym}</p>
            {prev.exercises.map((e,i)=><div key={i} style={S.exLine}><span style={S.exLineNm}>{e.name}</span>

        {wo.exercises.map((ex,ei)=>{ sc=0; const pr=prOf(ex.name, wo.gym); return (
          <div key={ei} style={S.exCard}>
            <div style={S.exHd}><h3 style={S.exNm}>{ex.name}{pr>0&&<span style={S.prBadge}>best {pr}</span>}</h3><div role="button" onClick={()=>rmEx(ei)} style={S.exDl}>✕</div></div>
            {ex.sets.map((s,si)=>{
              if(s.type==="normal"){sc++;const num=sc;return(<div key={si} style={S.sRow}>
                {setFilled(s)
                  ? <div role="button" onClick={()=>repeatSetEdit(ei,si)} style={S.sNumBtn} aria-label={`Repeat set ${num}`}>{num}</div>
                  : <span style={S.sNum}>{num}</span>}
                <input {...numProps(`${active}:${ei}:${si}`, s.reps, "reps", v=>updSet(ei,si,"reps",v), focusNextNum, 2)} style={S.sIn}/><span style={S.sX}>×</span>
                <input {...numProps(`${active}:${ei}:${si}:w`, s.weight, "kg", v=>updSet(ei,si,"weight",v), ()=>addSetEditFocus(ei,ex.sets.length), weightDigits(ex.name, wo.gym))} style={S.sIn}/>
                <input {...noteProps(`${active}:${ei}:${si}:n`, s.note, v=>updSet(ei,si,"note",v), 1.8)}/>
                <div role="button" onClick={()=>rmSet(ei,si)} style={S.sDel}>-</div></div>);}
              sc++;return(<div key={si} style={S.dsWrap}><div style={S.dsHead}><span style={S.dsLabel}>SET {sc} · DROPSET</span><div role="button" onClick={()=>rmSet(ei,si)} style={S.sDel}>-</div></div>
                {s.drops.map((d,di)=>(<div key={di} style={S.dsRow}><span style={S.dsArrow}>{di===0?">":"v"}</span>
                  <input {...numProps(`${active}:${ei}:${si}:d${di}`, d.reps, "reps", v=>updDrop(ei,si,di,"reps",v), focusNextNum)} style={S.sIn}/><span style={S.sX}>×</span>
                  <input {...numProps(`${active}:${ei}:${si}:d${di}w`, d.weight, "kg", v=>updDrop(ei,si,di,"weight",v), el=>el.blur())} style={S.sIn}/></div>))}
                <div role="button" onClick={()=>addDrop(ei,si)} style={S.dsAddDrop}>+ Drop</div></div>);
            })}
            <div style={S.addRow2}><div role="button" onClick={()=>addSet(ei,false)} style={S.asBtn}>+ Set</div><div role="button" onClick={()=>addSet(ei,true)} style={S.dsBtn2}>+ Dropset</div></div>
          </div>);})}
        </>);})()}

      {/* ---------- COACH ---------- */}
      {view==="coach" && (<div style={S.chatWrap}>
        {(data.chat||[]).length>0 && <div style={{display:"flex",justifyContent:"flex-end",marginBottom:6}}>
          {confirmDel==="chat"
            ? <div role="button" onClick={()=>{upd(d=>({...d,chat:[]}));setConfirmDel(null);}} style={S.cDelConfirm}>Clear chat history?</div>
            : <div role="button" onClick={()=>{setConfirmDel("chat");setTimeout(()=>setConfirmDel(c=>c==="chat"?null:c),4000);}} style={S.clearBtn}>clear chat</div>}
        </div>}
        <div style={S.chatScroll}>
          {(!data.chat||data.chat.length===0)&&<div style={S.emptyCoach}>
            <p style={{color:"#888",fontSize:13,lineHeight:1.6}}>Report sets and I log them automatically, with your history, plans, and injury notes as context.</p>
            <p style={{color:"#8a8a8a",fontSize:12,marginTop:8}}>Try: "Munich push day" or "Lat pulldown 10x69"</p></div>}
          {(data.chat||[]).map((m,i)=>(
            <div key={i} style={{...S.msg,...(m.role==="user"?S.msgU:S.msgA)}}>

              {m.role==="assistant"&&m.logged>0&&<div style={S.loggedChip}>✓ logged</div>}

        <div style={S.chatBar}>
          <input value={chatInput} onChange={e=>setChatInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendChat()} placeholder="Log sets or ask your coach..." style={S.chatIn}/>
          <div role="button" onClick={sendChat} style={{...S.chatSend,opacity:coachBusy?0.5:1}}>→</div>
        </div>
      </div>)}

      {/* ---------- DATA ---------- */}
      {view==="data" && (()=>{
        const json = JSON.stringify({version:1, workouts:data.workouts, chat:data.chat||[],
          ...(data.plans ? {plans:data.plans, plansAt:data.plansAt} : {}),
          ...(Array.isArray(data.gyms) ? {gyms:data.gyms, gymsAt:data.gymsAt} : {})});
        const doImport = (txt, mode) => {
          let p; try { p = JSON.parse(txt); } catch(e) { setIoMsg("That is not valid backup text. Copy the whole file contents including the outer braces."); return; }
          const incoming = Array.isArray(p) ? p : p.workouts;
          if (!Array.isArray(incoming)) { setIoMsg("No sessions found in that backup."); return; }
          upd(d=>{
            const have = new Set(d.workouts.map(w=>w.id));
            const add = incoming.filter(w=>w&&w.id&&!have.has(w.id));
            const ws = mode==="replace" ? incoming : [...d.workouts, ...add];
            // importing means "I want these back": lift any tombstone for
            // them, locally AND ones only the server still remembers
            const deleted = { ...(d.deleted || {}) };
            for (const w of incoming) if (w && w.id) delete deleted[w.id];
            Remote.recordRevive(incoming.filter(w=>w&&w.id).map(w=>w.id));
            /* a full replace restores the backup's plans too; merging only
               adds sessions, so the plans on this device are left alone */
            const stamp = new Date().toISOString();
            const planPatch = (mode==="replace" && p.plans)
              ? {plans:p.plans, plansAt: (p.plansAt && typeof p.plansAt === "object")
                  ? p.plansAt
                  : Object.fromEntries(Object.keys(p.plans).map(t=>[t,stamp]))}
              : {};
            /* same rule for the locations: a full replace restores the backup's
               list, a merge leaves this device's list alone */
            const gymPatch = (mode==="replace" && Array.isArray(p.gyms))
              ? {gyms:p.gyms, gymsAt: (typeof p.gymsAt === "string" && p.gymsAt) ? p.gymsAt : stamp}
              : {};
            return {...d, workouts: ws, deleted, chat: mode==="replace" ? (p.chat||[]) : (d.chat||[]), ...planPatch, ...gymPatch};
          });
          setIoMsg(mode==="replace" ? `Replaced everything with ${incoming.length} sessions.` : `Added ${incoming.filter(w=>!data.workouts.some(x=>x.id===w.id)).length} new sessions.`);
          setImportText("");
        };
        return (<>
          {IS_DEMO && (<>
          <p style={S.secT}>HOW THIS WORKS</p>
          <div style={S.planBox}>
            <p style={S.planLine}>This is a workout logger: pick a type and gym on the WORKOUT tab, start a session, log sets as you go, and watch the per-exercise charts grow under STATS.</p>
            {!IS_DOWNLOADED && <p style={S.planLine}>It comes preloaded with a few weeks of sample sessions so there is something to look at. Change or delete them freely, everything here is yours, and RESET below puts the samples back.</p>}
            <p style={S.planLine}>Your data stays in this browser and nothing is uploaded anywhere. Use the backup below to save it or move it to another device.</p>
            {IS_DOWNLOADED
              ? <p style={S.planLine}><b style={{color:"#ccc"}}>This is your own copy.</b> It runs straight off this file, offline, with your sessions in this browser. Keep the file somewhere safe and back up your log now and then with the button below.</p>
              : <p style={S.planLine}><b style={{color:"#ccc"}}>Want it for yourself?</b> Download the app below. It is one self-contained HTML file: open it from your own device and it works exactly like this, offline, with your data in your browser. No account, no server, nothing to pay.</p>}
            <p style={S.planLine}>The AI coach is optional. It needs an Anthropic API key from console.anthropic.com, pasted below. The key is stored only on your device and sent only to Anthropic. Any other LLM provider with a similar chat endpoint works too: swap the two coach requests in the source (search for "coachFetch").</p>
            <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
              {!IS_DOWNLOADED && <a href={location.pathname} download="jims-gym.html" style={{...S.cfBtn,flex:"1 1 160px",textDecoration:"none",display:"flex",alignItems:"center",justifyContent:"center"}}>DOWNLOAD THE APP</a>}
              {SOURCE_URL && <a href={SOURCE_URL} target="_blank" rel="noreferrer" style={{...S.cnBtn,textDecoration:"none",display:"flex",alignItems:"center",justifyContent:"center"}}>VIEW SOURCE ↗</a>}
            </div>
          </div>
          </>)}
          {!IS_DEMO && (<>
          <p style={S.secT}>SERVER SYNC</p>
          <div style={S.planBox}>
            <p style={S.planLine}>Sessions are saved to the server, so a lost or new phone can pick them up again. Enter the passphrase once and this device remembers it.</p>
            <input type="password" value={gymPass} onChange={e=>savePass(e.target.value.trim())} placeholder="Passphrase..." style={{...S.eIn,marginTop:8}}/>
            <p style={{...S.planLine,marginTop:6,color: sync==="synced"?"#8fbf6a":sync==="denied"?"#e69a9a":A52}}>
              {!gymPass ? "No passphrase yet. Everything stays on this device until you enter it."
                : sync==="synced" ? "Connected. Your sessions are saved on the server."
                : sync==="denied" ? "The server rejected this passphrase, so check the spelling. Data is safe on this device meanwhile."
                : sync==="offline" ? "Server unreachable right now. Working from the local copy, it will sync automatically."
                : sync==="checking" ? "Checking..."
                : "Connecting to the server..."}
            </p>
          </div>
          </>)}
          <p style={S.secT}>SETTINGS</p>
          <div style={S.planBox}>
            <div style={S.setRow}>
              <div style={{flex:1}}><p style={S.setNm}>Rest timer</p>
                <p style={S.setSub}>Adds a countdown button next to FINISH while you train. Off by default.</p></div>
              <div role="button" onClick={()=>setPref("restTimer",!prefs.restTimer)} style={{...S.tgl,...(prefs.restTimer?S.tglOn:{})}}>
                <span style={{...S.tglKnob,...(prefs.restTimer?S.tglKnobOn:{})}}/></div>
            </div>
            {prefs.restTimer && <div style={{display:"flex",gap:6,flexWrap:"wrap",margin:"0 0 14px"}}>
              {[60,90,120,180,240].map(sec=>(<div role="button" key={sec} onClick={()=>setPref("restSecs",sec)}
                style={{...S.fBtn,...(prefs.restSecs===sec?{borderColor:ACCENT,color:ACCENT,background:A10}:{})}}>{fmtSecs(sec)}</div>))}
            </div>}
            <div style={S.setRow}>
              <div style={{flex:1}}><p style={S.setNm}>Jump to the next field</p>
                <p style={S.setSub}>Reps move on after two digits. Weight moves on after two or three, depending on what you have ever lifted on that exercise: two for curls, three for leg press.</p></div>
              <div role="button" onClick={()=>setPref("autoJump",!prefs.autoJump)} style={{...S.tgl,...(prefs.autoJump?S.tglOn:{})}}>
                <span style={{...S.tglKnob,...(prefs.autoJump?S.tglKnobOn:{})}}/></div>
            </div>
            <div style={S.setRow}>
              <div style={{flex:1}}><p style={S.setNm}>Allow landscape</p>
                <p style={S.setSub}>Off means the app asks you to turn back to portrait when the phone is on its side.</p></div>
              <div role="button" onClick={()=>setPref("landscape",!prefs.landscape)} style={{...S.tgl,...(prefs.landscape?S.tglOn:{})}}>
                <span style={{...S.tglKnob,...(prefs.landscape?S.tglKnobOn:{})}}/></div>
            </div>
          </div>
          <p style={S.secT}>MAKE IT YOURS</p>
          <div style={S.planBox}>
            <p style={S.planLine}>Change the name and the colour whenever you like. The choice is kept on this device, so there is nothing to download or install again.</p>
            <p style={S.lookLbl}>Name</p>
            <input value={lkName} onChange={e=>setLkName(e.target.value.slice(0,18))} placeholder="Jim" maxLength={18} style={S.eIn}/>
            <p style={S.lookLbl}>Colour</p>
            <div style={S.lookRow}>
              {SWATCHES.map(c=>(<div role="button" key={c} onClick={()=>setLkAccent(c)}
                style={{...S.swatch,background:c,...(lkAccent.toLowerCase()===c?S.swatchOn:{})}}/>))}
              {/* anything else: the phone's own colour picker, behind a swatch */}
              <label style={{...S.swatch,...S.swatchAny,...(SWATCHES.includes(lkAccent.toLowerCase())?{}:S.swatchOn)}}>
                <input type="color" value={lkAccent} onChange={e=>setLkAccent(e.target.value)} style={S.swatchIn}/>
              </label>
            </div>
            <div style={S.lookPrev}>
              <p style={S.lookPrevTtl}>{possOf(lkClean||"Jim")}<span style={{color:lkAccent}}> GYM</span></p>
              <div style={{...S.lookPrevBtn,background:lkAccent}}>START PUSH · MUNICH</div>
            </div>
            {lumOf(lkAccent)<0.18 && <p style={{...S.setSub,color:"#e0a35c",marginTop:8}}>That colour is dark, so the black text on the START button will be hard to read. A brighter one works better on this near-black background.</p>}
            <p style={{...S.setSub,marginTop:8}}>Applying reloads the app. Your sessions are untouched. An icon already on your home screen keeps the name and artwork it was added with, everything inside the app changes straight away.</p>
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <div role="button" style={{...S.cfBtn,background:lkAccent,opacity:lookChanged?1:0.4}} onClick={()=>lookChanged&&applyLook()}>APPLY</div>
              {SAVED_LOOK && <div role="button" style={S.cnBtn} onClick={resetLook}>USE THE ORIGINAL</div>}
            </div>
          </div>
          <p style={S.secT}>WORKOUT PLANS</p>
          <div style={S.planBox}>
            <p style={S.planLine}>This is the checklist under a running workout. Changes save straight away and follow you to your other devices.</p>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",margin:"14px 0 4px"}}>
              {TAGS.map(t=>(<div role="button" key={t} onClick={()=>setPlanTag(t)}
                style={{...S.fBtn,...(planTag===t?{borderColor:TC[t]||ACCENT,color:TC[t]||ACCENT,background:"#1b1b1b"}:{})}}>{t}</div>))}
            </div>
            {planLinesOf(data,planTag).map((l,i)=>{
              const off = dragOffset("plan", i), held = off === null;
              return (
              <div key={i} data-planrow="1" style={{...S.planEditRow,
                ...(held ? {transform:`translateY(${drag.dy}px)`, zIndex:5, position:"relative", opacity:0.95} : {}),
                ...(!held && off ? {transform:`translateY(${off * (dragRef.current?.h || 46)}px)`} : {}),
                transition: drag && !held ? "transform .16s ease" : "none",
              }}>
                <div role="button" aria-label={`Reorder ${l||"line "+(i+1)}`} style={{...S.planGrip,...(held?{borderColor:ACCENT,color:ACCENT}:{})}}
                  onPointerDown={e=>dragStart(e,i,"plan",fn=>mutPlan(planTag,fn))} onPointerMove={dragMove}
                  onPointerUp={dragEnd} onPointerCancel={dragEnd}>
                  <svg width="12" height="18" viewBox="0 0 12 18" fill="currentColor" aria-hidden="true">
                    <circle cx="3" cy="4" r="1.5"/><circle cx="9" cy="4" r="1.5"/>
                    <circle cx="3" cy="9" r="1.5"/><circle cx="9" cy="9" r="1.5"/>
                    <circle cx="3" cy="14" r="1.5"/><circle cx="9" cy="14" r="1.5"/>

                  onChange={e=>{const v=e.target.value; mutPlan(planTag, ls=>ls.map((x,j)=>j===i?v:x));}}/>
                <div role="button" onClick={()=>mutPlan(planTag, ls=>ls.filter((_,j)=>j!==i))} style={S.planBtn} aria-label="Remove">✕</div>
              </div>);})}
            {planLinesOf(data,planTag).length===0 && <p style={{...S.setSub,margin:"6px 0 0"}}>No plan for {planTag} yet. Add the first exercise below.</p>}

            </div>
            <p style={{...S.setSub,marginTop:12}}>Matching is forgiving: anything in brackets is ignored, and OR or a slash offers alternatives, so "Pull-Up OR Lat Pulldown" ticks off for either. A line starting with "Abs" is ticked by any core exercise, whatever it is called.</p>
          </div>
          <p style={S.secT}>WORKOUT LOCATIONS</p>

            {gymsOf(data).map((g,i)=>{
              const off = dragOffset("gyms", i), held = off === null;
              return (
              <div key={i} data-planrow="1" style={{...S.planEditRow,
                ...(held ? {transform:`translateY(${drag.dy}px)`, zIndex:5, position:"relative", opacity:0.95} : {}),
                ...(!held && off ? {transform:`translateY(${off * (dragRef.current?.h || 46)}px)`} : {}),
                transition: drag && !held ? "transform .16s ease" : "none",
              }}>
                <div role="button" aria-label={`Reorder ${g||"location "+(i+1)}`} style={{...S.planGrip,...(held?{borderColor:ACCENT,color:ACCENT}:{})}}
                  onPointerDown={e=>dragStart(e,i,"gyms",mutGyms)} onPointerMove={dragMove}
                  onPointerUp={dragEnd} onPointerCancel={dragEnd}>
                  <svg width="12" height="18" viewBox="0 0 12 18" fill="currentColor" aria-hidden="true">
                    <circle cx="3" cy="4" r="1.5"/><circle cx="9" cy="4" r="1.5"/>
                    <circle cx="3" cy="9" r="1.5"/><circle cx="9" cy="9" r="1.5"/>
                    <circle cx="3" cy="14" r="1.5"/><circle cx="9" cy="14" r="1.5"/>
                  </svg>
                </div>
                <input value={g} placeholder="Location" style={{...S.eIn,flex:1,minWidth:0}}
                  onChange={e=>{const v=e.target.value; mutGyms(ls=>ls.map((x,j)=>j===i?v:x));}}/>
                <div role="button" onClick={()=>mutGyms(ls=>ls.filter((_,j)=>j!==i))} style={S.planBtn} aria-label="Remove">✕</div>
              </div>);})}
            {gymsOf(data).length===0 && <p style={{...S.setSub,margin:"6px 0 0"}}>No locations yet. Add your first one below.</p>}
            <div style={{display:"flex",gap:8,marginTop:12}}>
              <div role="button" onClick={()=>mutGyms(ls=>[...ls,""])} style={S.cfBtn}>+ ADD LOCATION</div>
              {Array.isArray(data.gyms) && <div role="button" onClick={resetGyms} style={S.cnBtn}>Reset</div>}
            </div>
            <p style={{...S.setSub,marginTop:12}}>Sessions you have already logged keep the location they were logged with, so renaming or removing one here never rewrites your history. Those older names still show on the session and in the stats filter, they just stop being offered for new workouts.</p>
            {gymsUsed.length>0 && <p style={{...S.setSub,marginTop:6}}>Still on old sessions but not in the list above: {gymsUsed.join(", ")}.</p>}
          </div>
          <p style={S.secT}>BACKUP</p>
          <div style={S.planBox}>
            <p style={S.planLine}>{IS_DEMO
              ? `${data.workouts.length} sessions stored in this browser. Copy or download this text to move your log to another device.`
              : `${data.workouts.length} sessions stored${sync==="synced"?" on the server, with a copy on this device":" on this device"}. A copied backup now and then is still the safest belt and braces.`}</p>
            <textarea readOnly value={json} onFocus={e=>e.target.select()} style={S.jsonBox}/>
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <div role="button" style={S.cfBtn} onClick={()=>{navigator.clipboard?.writeText(json).then(()=>setIoMsg("Backup copied to clipboard.")).catch(()=>setIoMsg("Copy failed, select the text above and copy manually."));}}>COPY BACKUP</div>
              <div role="button" style={S.cnBtn} onClick={()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=`jims-gym-${tod()}.json`;a.click();setIoMsg("Download started.");}catch(e){setIoMsg("Download not allowed here, use copy instead.");}}}>DOWNLOAD</div>
            </div>
          </div>
          <p style={S.secT}>COACH API KEY</p>
          <div style={S.planBox}>
            <p style={S.planLine}>{!IS_DEMO && gymPass
              ? "With the passphrase set, the coach runs through the server and needs no key here. This field is only a fallback."
              : "The coach and the automatic feedback after each exercise need an Anthropic API key. It is stored only on this device and sent only to Anthropic."}</p>
            <input type="password" value={apiKey} onChange={e=>saveKey(e.target.value.trim())} placeholder="sk-ant-..." style={{...S.eIn,marginTop:8}}/>
            <p style={{...S.planLine,color:(apiKey||(!IS_DEMO&&gymPass))?"#8fbf6a":A52,marginTop:6}}>{!IS_DEMO && gymPass ? "Coach is active via the server." : apiKey?"Key saved on this device. Coach is active.":"No key yet. Logging works fully without it, only the coach is off."}</p>
          </div>
          <p style={S.secT}>RESTORE OR IMPORT</p>
          <div style={S.planBox}>
            <p style={S.planLine}>Paste backup text below, or pick a backup file.</p>
            <input type="file" accept=".json,application/json,text/plain" onChange={e=>{const f=e.target.files?.[0]; if(!f)return; const r=new FileReader(); r.onload=()=>setImportText(String(r.result)); r.readAsText(f);}} style={{...S.planLine,marginTop:8,color:"#888"}}/>
            <textarea value={importText} onChange={e=>setImportText(e.target.value)} placeholder="Paste backup text here..." style={S.jsonBox}/>
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <div role="button" style={{...S.cfBtn,opacity:importText.trim()?1:0.4}} onClick={()=>importText.trim()&&doImport(importText,"merge")}>ADD MISSING SESSIONS</div>
              {confirmDel==="imp"
                ? <div role="button" style={S.cDelConfirm} onClick={()=>{doImport(importText,"replace");setConfirmDel(null);}}>Replace all?</div>
                : <div role="button" style={{...S.cnBtn,opacity:importText.trim()?1:0.4}} onClick={()=>{if(importText.trim()){setConfirmDel("imp");setTimeout(()=>setConfirmDel(c=>c==="imp"?null:c),4000);}}}>REPLACE ALL</div>}
            </div>
            {ioMsg&&<p style={{...S.planLine,color:ACCENT,marginTop:8}}>{ioMsg}</p>}
          </div>
          {IS_DEMO && (<>
          <p style={S.secT}>RESET</p>
          <div style={S.planBox}>
            <p style={S.planLine}>{IS_DOWNLOADED

      </>)}

        <h2 style={S.dtTitle}>{statsEx}</h2>

        {chartData.length>1 && <div style={S.chartBox}>
          <p style={S.newL}>TOP SET WEIGHT{statsGym!=="All"?` · ${statsGym.toUpperCase()}`:" · ALL GYMS (calibrations differ)"}</p>

        {chartData.length<=1 && <p style={{color:"#8a8a8a",fontSize:12,marginBottom:14}}>Not enough weighted data for a chart with this filter.</p>}
        {getHist(statsEx,statsGym).slice().reverse().map((h,i)=>(
          <div key={i} style={S.card}>
            <div style={S.cTop}><div><span style={{...S.cTag,color:TC[h.tag]||"#999",borderColor:(TC[h.tag]||"#999")+"44"}}>{h.tag}</span><span style={S.cDate}>{fmtD(h.date)}</span><span style={S.cGym}>{h.gym}</span></div>

            <div style={S.dtSets}>{h.sets.map((s,j)=><span key={j} style={s.type==="dropset"?S.dtDS:S.dtSet}>{setStr(s)}</span>)}</div>
          </div>))}
      </>)}
      </div>

      {/* The tab bar sits at the BOTTOM, the way iOS apps do: this is a
          one-handed app used mid-set, and the top of a phone is the hardest
          place to reach with a thumb. */}
      <div className="gymtabbar" style={S.tabbar}>
        {TABS.map(([v,l,icon])=>{ const on = view===v;
          return (<div role="button" key={v} onClick={()=>{setView(v);setActive(null);setStatsEx(null);}}
            style={{...S.tab,...(on?{color:ACCENT}:{})}}>
            <span style={{...S.tabIc,...(on?{background:A14}:{})}}>
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                strokeWidth={on?2:1.7} strokeLinecap="round" strokeLinejoin="round" style={{display:"block"}}>{icon}</svg>
            </span>
            <span style={S.tabL}>{l}</span>
          </div>);})}
      </div>
    </div>
  );
}

  planEdit:{fontSize:12,color:A84,textDecoration:"underline",flex:"0 0 auto",marginBottom:8},
  planEditRow:{display:"flex",alignItems:"center",gap:6,marginBottom:8},
  /* touchAction none, or the first drag scrolls the page instead of the row */
  planGrip:{width:34,height:38,borderRadius:7,background:"#171717",border:"1px solid",borderColor:"#2c2c2c",
    color:"#8a8a8a",flex:"0 0 auto",cursor:"grab",touchAction:"none"},
  planBtn:{width:34,height:38,borderRadius:7,background:"#171717",border:"1px solid",borderColor:"#2c2c2c",
    color:"#c4c4c4",fontSize:14,flex:"0 0 auto",cursor:"pointer"},
  planTickDone:{background:A20,borderColor:ACCENT,color:ACCENT},
  /* the one you are on: outlined in the accent, filled only when finished */
  planTickNow:{background:A05,borderColor:ACCENT,color:ACCENT},
  /* cross + tick in the running-workout header */
  wBtn:{width:40,height:40,borderRadius:11,border:"1px solid",display:"flex",
    alignItems:"center",justifyContent:"center",flex:"0 0 auto"},
  wConfirm:{padding:"9px 14px",borderRadius:11,border:"1px solid",fontSize:13,fontWeight:700,whiteSpace:"nowrap"},
  durChip:{fontSize:12,color:"#8a8a8a",fontFamily:"'JetBrains Mono'",marginLeft:8},
  /* settings rows in the DATA tab */
  setRow:{display:"flex",alignItems:"flex-start",gap:12,marginBottom:12},
  setNm:{fontSize:14,fontWeight:600,color:"#e8e8e8"},
  setSub:{fontSize:13,color:"#9a9a9a",lineHeight:1.5,marginTop:2},
  /* MAKE IT YOURS. borderColor is a separate key in the base swatch style for
     the usual reason: the shorthand alone loses its colour on deselection. */
  lookLbl:{fontSize:14,fontWeight:600,color:"#e8e8e8",margin:"14px 0 6px"},
  lookRow:{display:"grid",gridTemplateColumns:"repeat(5, 1fr)",gap:8},
  swatch:{height:44,borderRadius:10,border:"2px solid",borderColor:"#242424",cursor:"pointer",padding:0,overflow:"hidden"},
  swatchOn:{borderColor:"#f0f0f0"},
  swatchAny:{background:"conic-gradient(#ff7b5c,#ffcc4d,#86e05c,#34d399,#64b5ff,#a78bfa,#f472b6,#ff7b5c)"},
  swatchIn:{opacity:0,width:"100%",height:"100%",border:"none",background:"none",padding:0,cursor:"pointer"},
  lookPrev:{marginTop:14,padding:"14px 14px 16px",borderRadius:10,background:"#101010",border:"1px solid #1e1e1e"},
  lookPrevTtl:{fontSize:19,fontWeight:700,letterSpacing:"0.12em",color:"#f0f0f0",lineHeight:1},
  lookPrevBtn:{marginTop:12,padding:"13px 0",borderRadius:10,color:"#0c0c0c",fontSize:13,fontWeight:700,
    letterSpacing:"0.08em",textAlign:"center"},
  /* borderColor is its own key in the BASE style on purpose: with only the
     `border` shorthand here, React drops the colour when the toggle goes off
     and it falls back to currentColor. */
  tgl:{width:48,height:28,borderRadius:14,background:"#1a1a1a",border:"1px solid",borderColor:"#333",
    flex:"0 0 auto",display:"flex",alignItems:"center",justifyContent:"flex-start",padding:2,cursor:"pointer",
    transition:"background .18s ease"},
  tglOn:{background:A28,borderColor:ACCENT},
  tglKnob:{width:22,height:22,borderRadius:11,background:"#666",display:"block",transition:"transform .18s ease, background .18s ease"},
  tglKnobOn:{background:ACCENT,transform:"translateX(20px)"},
  stCard:{background:"#141414",border:"1px solid #1e1e1e",borderRadius:10,padding:14,marginBottom:8,cursor:"pointer"},
  stTop:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10},
  stNm:{fontSize:15,fontWeight:700,color:"#e8e8e8",display:"flex",alignItems:"center",gap:7},
  catChip:{fontSize:11,fontWeight:600,letterSpacing:"0.05em",border:"1px solid",borderRadius:4,padding:"2px 7px"},
  stGrid:{display:"flex",gap:8},
  stBl:{flex:1,background:"#0e0e0e",border:"1px solid #1e1e1e",borderRadius:7,padding:"9px 6px",textAlign:"center"},
  stV:{fontSize:18,fontFamily:"'JetBrains Mono'",color:ACCENT,display:"block"},
  stSub:{fontSize:11,color:"#8a8a8a",letterSpacing:"0.06em",textTransform:"uppercase",display:"block",marginTop:3},
  dtTitle:{fontSize:22,fontWeight:700,color:"#f2f2f2",marginBottom:10},
  dtMax:{fontSize:13,fontFamily:"'JetBrains Mono'",color:ACCENT},
  dtSets:{display:"flex",flexWrap:"wrap",gap:5,marginTop:5},
  dtSet:{fontSize:13,fontFamily:"'JetBrains Mono'",color:"#c4c4c4",background:"#1a1a1a",border:"1px solid #242424",borderRadius:4,padding:"4px 9px"},
  dtDS:{fontSize:13,fontFamily:"'JetBrains Mono'",color:"#ff9a55",background:"#18140e",border:"1px solid #332a1a",borderRadius:4,padding:"4px 9px"},
  chartBox:{background:"#111",border:"1px solid #1e1e1e",borderRadius:10,padding:"12px 8px 4px",marginBottom:14},
  chatWrap:{display:"flex",flexDirection:"column",flex:1,minHeight:"60vh"},
  chatScroll:{flex:1,overflowY:"auto",paddingBottom:12},
  emptyCoach:{padding:"30px 10px",textAlign:"center"},
  msg:{maxWidth:"85%",padding:"11px 14px",borderRadius:12,fontSize:15,lineHeight:1.55,marginBottom:8,whiteSpace:"pre-wrap"},
  msgU:{background:A10,border:"1px solid " + A20,color:"#dfe",marginLeft:"auto",borderBottomRightRadius:4},
  msgA:{background:"#141414",border:"1px solid #242424",color:"#dcdcdc",marginRight:"auto",borderBottomLeftRadius:4},
  loggedChip:{fontSize:12,color:ACCENT,marginTop:6,fontFamily:"'JetBrains Mono'"},
  /* sticks just above the floating tab bar rather than under it */
  chatBar:{display:"flex",gap:8,position:"sticky",bottom:"calc(78px + var(--gp-safe-bottom, env(safe-area-inset-bottom)))",background:"#0c0c0c",paddingTop:8,paddingBottom:8},
  chatIn:{flex:1,padding:"12px 14px",background:"#141414",border:"1px solid #252525",borderRadius:10,color:"#eee",fontSize:14,fontFamily:"'DM Sans'"},
  chatSend:{width:48,borderRadius:10,background:ACCENT,border:"none",color:"#0c0c0c",fontSize:18,fontWeight:700,cursor:"pointer"},
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
