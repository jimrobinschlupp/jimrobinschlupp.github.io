<!-- Add to Home Screen. The icon is a plain drawn monogram, deliberately
     generic: this is a template, and anyone running their own trip is
     expected to replace the files in icons/ with their own artwork. Drawn
     rather than borrowed, so it can be redistributed with the app.
     Opaque background on purpose: iOS renders transparency in a touch icon
     as black. The -v2 filenames are not a version number: iOS caches a touch
     icon by URL and ignores query strings, so replacing the art on an
     already-installed phone needs a new filename, not a new file. -->
<!-- Demo build: no icons, no manifest, no service worker. An empty data
     URI rather than no icon at all, so the browser does not go looking
     for /favicon.ico on whatever host this ends up embedded in. -->
<link rel="icon" href="data:,">
<title>Nile Week · a demo trip</title>

<style>
/* ------------------------------------------------------------------ *
 * Kreta
 *
 * Built for people who are on holiday, which is to say: tired, sunburnt,
 * a bit drunk, outside in bright light or in the dark outside a bar, on a
 * phone, on bad signal. Every decision below follows from that.
 *
 *   - large type and high contrast, because squinting is the failure mode
 *   - big tap targets, because fine motor control is the second one
 *   - one question per screen, because reading is the third
 *   - dark by default, because that is when plans get made
 * ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ type
 *
 * Six sizes, and a rule about which is which. Before this there were
 * twenty-six, including 12, 12.5, 13, 13.5, 14, 14.5 and 15: seven steps
 * inside three pixels, which no eye can tell apart. The formatting was
 * therefore encoding distinctions nobody could see, and the app read as
 * though each screen had been styled by whoever touched it last, because in
 * effect it had.
 *
 * A step is only worth having if it is visible. These are 15 to 25 per cent
 * apart, except the one pair that is close on purpose, explained below.
 *
 *   eyebrow  11    UPPERCASE AND TRACKED. Section heads, pills, tab labels.
 *                  Never a sentence. Its treatment, not its size, is what
 *                  makes it read as a label.
 *   caption  12    The line under a title. Timestamps, counts, "3 von 6",
 *                  the model and the supplier. Fragments, not sentences.
 *   body     15    Everything anybody actually reads. Paragraphs, list item
 *                  titles, buttons. This is the default, so prose that has
 *                  no class on it is already right.
 *   lead     17    The one line a card is about, and sheet headings.
 *   title    21    The name of the screen you are on.
 *
 *   ui     13.5    Compact controls only: small buttons, chips, toasts.
 *                  This is the pair that sits close to caption, and it is
 *                  allowed because a control and a caption are never the
 *                  same kind of thing, so they are never compared. Using it
 *                  for prose puts the two back within a pixel of each other
 *                  and undoes the whole exercise. Don't.
 *
 * Deliberately outside the scale, and staying that way:
 *   - .input/.select/.textarea are pinned at 16px. Below that, iOS zooms the
 *     page when the field takes focus, which is a worse bug than an off-scale
 *     number.
 *   - .avatar sizes fit initials inside a circle, so they follow the circle.
 *   - .bignum, .hero .big, .pin, .empty .mark and the lock screen marks are
 *     display type. They are pictures of numbers, not text.
 *   - .leaflet-control-attribution is Leaflet's own and not ours to set.
 */
:root {
  --t-eyebrow: 11px;
  --t-caption: 12px;
  --t-ui: 13.5px;
  --t-body: 15px;
  --t-lead: 17px;
  --t-title: 21px;

  /* Numerals a card is built around: a flight time, a total, an amount. These
     are read as figures rather than as text, which is why they may be larger
     than the prose beside them without competing with it. Three sizes, not
     the four unrelated ones that grew here by hand. */
  --t-num-s: 17px;
  --t-num-m: 22px;
  --t-num-l: 26px;

  --bg: #0a1014;
  --surface: #111b20;
  --surface-2: #17242a;
  --raised: #1d2d34;
  --line: #22343a;
  --line-soft: #1a292f;
  --text: #e9f2f1;
  --muted: #82989c;
  --dim: #5d7176;
  --accent: #3d95e8;
  --accent-soft: #12283d;
  --accent-ink: #04182b;
  --warn: #f0a742;
  --warn-soft: #33270f;
  --alarm: #ff6f5b;
  --good: #35c98f;
  --alarm-soft: #351913;
  --sky: #6bb6e8;
  --sky-soft: #12262f;
  /* Section tints (wash) and their edge colours (markers, strokes). */
  --t-sea:#102334; --t-sand:#2b2214; --t-sky:#122430; --t-coral:#2c1714; --t-violet:#1f1a31;
  --e-sea:#3d95e8; --e-sand:#e8b45e; --e-sky:#6bb6e8; --e-coral:#ff8f7a; --e-violet:#a493ee;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --r: 18px;
  --r-sm: 12px;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f2f5f4;
    --surface: #ffffff;
    --surface-2: #f7faf9;
    --raised: #ffffff;
    --line: #dfe7e5;
    --line-soft: #ebf1ef;
    --text: #0f1c1b;
    --muted: #5e7476;
    --dim: #8ba0a2;
    --accent: #1668b8;
    --accent-soft: #e0edfa;
    --accent-ink: #ffffff;
    --warn: #b57614;
    --warn-soft: #fdf1dc;
    --alarm: #d1452e;
    --good: #0f9d63;
    --alarm-soft: #fce6e1;
    --sky: #2b7fb8;
    --sky-soft: #e2f0f9;
    --t-sea:#e3eefb; --t-sand:#fcf2de; --t-sky:#e7f2fa; --t-coral:#fdece7; --t-violet:#efeafb;
    --e-sea:#1668b8; --e-sand:#bd8a24; --e-sky:#2b7fb8; --e-coral:#d1452e; --e-violet:#6b5bc4;
    --shadow: 0 1px 2px rgba(16,40,44,.06), 0 6px 20px rgba(16,40,44,.06);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: var(--t-body);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
h1,h2,h3,h4 { margin: 0; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------- layout ---- */

/* Exactly the viewport, not at least it. With min-height the column grew to
   fit its content, .scroll grew with it, and so nothing inside ever
   overflowed: the document scrolled instead, which is why the scrollbar ran
   the height of the window and passed behind both bars. Measured on the phone
   before this: .app was 3636px tall inside an 852px screen.
   dvh and not %. On an installed iOS app html at 100% resolves to 793 against
   a real 852, short by exactly the 59px top inset, and that shortfall lands at
   the bottom as a band of empty screen. dvh reports 852. This was got wrong
   once already, in both directions; the numbers came off the device. */
.app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
/* Installed, dvh lies, and it lies in a way that hides itself.
   Measured on the phone: with a document tall enough to scroll it reported
   852, the whole screen. The moment the app was sized to it and stopped
   overflowing, it reported 793 instead, short by exactly the 59px top inset,
   and the app came out 59px too short with a band of empty screen under the
   nav. Sizing to it changed it. That is three failed attempts, by three
   different-looking routes, all the same cause.
   vh and lvh read 852 in both states, which is also screen.height, and in a
   web app opened from the home screen with a translucent status bar the
   whole screen is exactly what the page gets. So: dvh in a browser, where it
   correctly tracks the toolbars coming and going, and vh here, where there
   are none to track. */
@media (display-mode: standalone) {
  .app { height: 100vh; }
}
/* The column between the two bars, at every width now rather than only on
   desktop. min-height 0 is what lets it be shorter than its content. */
.main { order: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; }

.scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  /* Clears the tab bar and the ask button floating above it. At 96px the last
     row of a long list stayed permanently tucked under the button, which is
     the sort of thing you only notice on the one screen where the last row is
     the one you wanted.
     The top gap is the header's own bottom padding answered back. Without it
     the first card's top border landed on the divider rule and the two read as
     one thick smudged line, worst on Now where the pair of squares meets it
     with a hard flat edge across the whole width.
     The bottom clears the ask button and nothing else. It used to clear the
     nav bar and the safe area too, because the nav was fixed and lay over this
     pane, which on a phone meant 166px of empty screen at the end of every
     list. The nav is a row of the column now and the pane stops above it, so
     the safe area is the nav bar problem and this is only about the button. */
  padding: 14px 16px 66px;
  -webkit-overflow-scrolling: touch;
}

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(14px);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--line-soft);
}
.topbar h1 { font-size: var(--t-title); letter-spacing: -.03em; }
.phasebtn {
  display: flex; align-items: center; gap: 6px; padding: 0;
  color: var(--text); text-align: left;
}
.phasebtn svg { color: var(--muted); flex-shrink: 0; margin-top: 4px; }
.phasebtn:active { opacity: .6; }
.topbar .sub { font-size: var(--t-caption); color: var(--muted); font-weight: 500; letter-spacing: 0; }

.who {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 6px 5px 12px; font-size: var(--t-ui); font-weight: 600;
  transition: background .15s, color .15s, border-color .15s;
}
/* Filled when you are on the screen it opens, the same way a tab fills in the
   nav bar. Without it the settings screen is the one place in the app with no
   indication of where you are. */
.who.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
/* Sized up on request: at 26px the monkeys were postage stamps, and the faces
   are most of the fun. The three tiers keep their proportions; the picker grid
   (.monkey) is its own thing and stays as it is. */
.avatar {
  width: 36px; height: 36px; border-radius: 999px; flex-shrink: 0;
  display: grid; place-items: center;
  font-size: 14.5px; font-weight: 700; letter-spacing: -.02em;
  background: var(--accent); color: var(--accent-ink);
}
.avatar.lg { width: 52px; height: 52px; font-size: 20px; }
.avatar.sm { width: 29px; height: 29px; font-size: 12.5px; }
/* An emoji avatar is the glyph on its own colour, with no image behind it, so
   a trip can give everyone a face without shipping a single file. The size is
   a share of the circle rather than the initials' size, which is set for two
   letters and leaves a picture looking lost. */
.avatar.emoji { font-weight: 400; letter-spacing: 0; font-size: 21px; background: var(--surface-2); }
.avatar.lg.emoji { font-size: 30px; }
.avatar.sm.emoji { font-size: 17px; }
.avatar .glyph { display: block; line-height: 1; }

/* A home screen icon at roughly the size one really is, and rounded the way
   iOS rounds it, so what the preview shows is what the phone shows. The glyph
   sits at the same fraction of the tile the drawing uses, or the preview
   would be a picture of a different icon. */
.iconprev { width: 88px; height: 88px; border-radius: 20px; display: grid; place-items: center; font-size: 51px; flex-shrink: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 9px; }
.swatch {
  width: 32px; height: 32px; border-radius: 999px; padding: 0; cursor: pointer;
  border: 2px solid var(--line); transition: border-color .12s;
}
.swatch[aria-pressed="true"] { border-color: var(--text); }

/* bottom tabs on phones, side rail on desktop */
/* A row of the column rather than a thing floating over it, so the pane stops
   where the bar starts and takes its scrollbar with it. The translucency stays:
   it is the app own background showing through now rather than the list, which
   costs nothing and keeps the bar looking like the same bar. */
.tabs {
  order: 2; flex-shrink: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 2px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.6) blur(18px);
  -webkit-backdrop-filter: saturate(1.6) blur(18px);
  border-top: 1px solid var(--line-soft);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 4px 5px; border-radius: 14px;
  font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: .01em;
  color: var(--dim); transition: color .15s, background .15s;
  /* Five across on a 375px phone leaves about 70px of text room. A label that
     wraps would push its tab taller than the other four and buckle the row,
     so labels stay on one line. There used to be a 9.5px squeeze below 380px
     to guarantee that; measured on the narrowest phone we care about, the
     longest label of either language is 39px in a 70px box, so the squeeze was
     buying nothing and cost a size nobody else in the app uses. */
  white-space: nowrap; min-width: 0;
}
.tab svg { width: 21px; height: 21px; stroke-width: 1.9; }
.tab.on { color: var(--accent); background: var(--accent-soft); }
body.sheet-open .tabs { display: none; }
.tab .dot {
  position: absolute; transform: translate(13px,-3px);
  width: 7px; height: 7px; border-radius: 999px; background: var(--alarm);
}

@media (min-width: 900px) {
  .app { flex-direction: row; }
  .tabs {
    /* First again: on a phone the bar is the floor, here it is the left edge,
       and the source has it before the pane either way. */
    order: 0;
    height: 100%; width: 216px; flex-shrink: 0;
    grid-template-columns: 1fr; grid-auto-rows: max-content;
    align-content: start; gap: 4px;
    padding: 24px 14px; border-top: none; border-right: 1px solid var(--line-soft);
  }
  .tab { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 11px 14px; font-size: var(--t-body); border-radius: 12px; }
  .tab svg { width: 19px; height: 19px; }
  .tab .dot { transform: translate(0,0); position: static; margin-left: auto; }
  .railhead { padding: 4px 14px 20px; }
  .railhead h1 { font-size: var(--t-title); }
  .railhead .sub { font-size: var(--t-caption); color: var(--muted); margin-top: 2px; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* No tab bar down here, but the ask button still sits bottom right. */
  .scroll { padding: 14px 28px 96px; }
  /* Was 780px, which on a 13" MacBook left a third of the window empty on
     each side. The cap now only bites on genuinely wide monitors. */
  .inner { max-width: 1400px; margin: 0 auto; width: 100%; }
  .topbar { padding-top: 20px; }
}
@media (max-width: 899px) { .railhead { display: none; } }

.inner { width: 100%; }

/* ----------------------------------------------------- cards ---- */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card.flat { box-shadow: none; background: var(--surface-2); }
.card.tight { padding: 14px; }

/* Section tints. Every card being the same white rectangle means the eye has
   to read to navigate, which on a phone at the end of a long day it will not
   do. A wash of colour per subject lets you find the money card by its colour
   before you have read a word. Kept faint: this is wayfinding, not decoration. */
.tone-sea    { background: linear-gradient(158deg, var(--t-sea),    var(--surface) 76%); }
.tone-sand   { background: linear-gradient(158deg, var(--t-sand),   var(--surface) 76%); }
.tone-sky    { background: linear-gradient(158deg, var(--t-sky),    var(--surface) 76%); }
.tone-coral  { background: linear-gradient(158deg, var(--t-coral),  var(--surface) 76%); }
.tone-violet { background: linear-gradient(158deg, var(--t-violet), var(--surface) 76%); }

/* Recommendations.

   The admin cannot hand his friends jobs, and an app that states "so-and-so
   meets the keyholder" as fact is really the admin saying it. Badging these as
   worked-out recommendations moves the authority off him and onto the reasoning, which
   people can then agree with or ignore. The reason underneath is doing the
   actual persuading; the badge just stops it reading as an order. */
.pill.rec { background: var(--t-violet); color: var(--e-violet); border-color: transparent; }
/* Everything we worked out lives inside one of these, and nothing else does.
   A check-in window of 16:00 is a fact off the booking; being at the door at
   16:00 rather than 19:00 is our suggestion, and the two should not look
   alike. Purple means we derived it. */
.recblock { background: var(--t-violet); border-radius: 14px; padding: 12px 13px; margin: 14px 0 4px; }
.recblock .pill.rec { margin-bottom: 8px; }
.recblock .why { border-left: none; padding-left: 0; margin-top: 6px; }
/* The badge text is 11px uppercase, so a star matched to it disappears. This
   one deliberately overhangs the line: it is the thing that tells you a
   machine wrote what follows, and it has to be seen before the words are. */
/* The star deliberately overhangs the cap height of the label. It is the mark
   that says a machine wrote what follows, and it has to be read before the
   words are. The negative margin is symmetric, so it takes height out of the
   layout without shifting the glyph off centre. */
.pill.rec { padding: 4px 11px 4px 7px; gap: 5px; }
.pill.rec svg { width: 18px; height: 18px; flex-shrink: 0; margin: -3px 0; }

/* ------------------------------------------------------- ask bar --- */

/* Floats over whatever screen you are on, because the questions people
   actually have ("when does she land", "what do I owe him") do not belong to
   any one tab. Violet, like every other thing in here the machine produced,
   so it is never mistaken for a fact somebody typed in. */
.askbtn {
  position: fixed; z-index: 25; right: 14px;
  bottom: calc(74px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 7px;
  padding: 11px 15px 11px 13px; border-radius: 999px;
  background: var(--e-violet); color: #fff;
  font-size: var(--t-ui); font-weight: 650; letter-spacing: .01em;
  box-shadow: 0 6px 22px -6px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08) inset;
  transition: transform .14s ease, opacity .14s;
}
.askbtn:active { transform: scale(.95); }
.askbtn svg { width: 17px; height: 17px; }
body.sheet-open .askbtn { display: none; }
@media (min-width: 900px) { .askbtn { bottom: 26px; right: 26px; padding: 13px 19px 13px 16px; font-size: var(--t-body); } }

.askrow { display: flex; gap: 8px; align-items: flex-end; }
.askrow .input { flex: 1 1 auto; }
.asksend { flex: 0 0 auto; padding: 0 15px; height: 44px; }

.qa { border-top: 1px solid var(--line-soft); padding: 13px 0 2px; }
.qa:first-child { border-top: none; padding-top: 4px; }
/* Whose question it was, read before the question itself. Six people share
   this log, and "what do I owe him" means something different depending on
   who asked it. */
.qa .qhead { display: flex; gap: 9px; align-items: flex-start; margin-bottom: 8px; }
.qa .qhead > div { min-width: 0; }
.qa .qhead .avatar { margin-top: 1px; }
.qa .q { font-weight: 640; font-size: var(--t-body); }
.qa .qwho { font-size: var(--t-eyebrow); color: var(--muted); margin-top: 2px; }
.qa .a {
  background: var(--t-violet); border-radius: 12px; padding: 11px 12px;
  font-size: var(--t-body); line-height: 1.55; white-space: pre-wrap;
}
.qa .a.thinking { color: var(--muted); font-style: italic; }

/* ------------------------------------------------------- record --- */

/* Named logrow, not rec. It was .rec, which the AI badge also carries as its
   second class ("pill rec"), so every badge in the app was quietly picking up
   this row's padding and border: 2px above the label and 4px below it, which
   is why the pill looked dropped inside its own background. */
.logrow { padding: 11px 0; border-top: 1px solid var(--line-soft); }
.logrow:first-of-type { border-top: none; padding-top: 2px; }
.logline { font-size: var(--t-body); line-height: 1.45; }
/* Struck, not hidden. The whole point of the screen is that a void is a thing
   you can see somebody did, not a thing that quietly stopped existing. */
.logline.dead { text-decoration: line-through; color: var(--muted); }
.why {
  border-left: 2px solid var(--line); padding-left: 11px;
  margin: 8px 0 4px; line-height: 1.5; font-size: var(--t-caption); color: var(--muted);
}
/* Monkey picker */
.monkeys { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
.monkey {
  position: relative; aspect-ratio: 1; border-radius: 16px; overflow: hidden;
  border: 2px solid var(--line); background: var(--surface-2); padding: 0;
  transition: border-color .15s, transform .1s, opacity .15s;
}
.monkey img { width: 100%; height: 100%; object-fit: cover; display: block; }
.monkey .glyphbox { width: 100%; height: 100%; display: grid; place-items: center; font-size: 46px; }
.monkey.gone .glyphbox { filter: grayscale(1); }
.monkey:active { transform: scale(.96); }
.monkey.on { border-color: var(--accent); }
.monkey.gone { opacity: .32; }
.monkey.gone img { filter: grayscale(1); }
.monkey .tag {
  position: absolute; left: 0; right: 0; bottom: 0;
  font-size: var(--t-eyebrow); font-weight: 700; letter-spacing: .02em; padding: 4px 3px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(6px); color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.monkey.on .tag { background: var(--accent); color: var(--accent-ink); }
/* Dashboard layout.

   Unified column on a phone and a bento grid on a desktop, because a mosaic
   at 375px is just a cramped mosaic. The only pairing that survives the narrow
   screen is the two small square tiles, which is exactly the bit that was
   wasting a full-width row on a two-digit number. */
.mosaic {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 12px; padding-bottom: 8px;
  /* dense backfills a narrow tile into any gap a wide one leaves, which stops
     holes opening in the middle. Ragged along the bottom is fine. */
  grid-auto-flow: dense;
}
/* Sized to content, not stretched to the tallest thing in the row: a
   countdown padded out to match a tall map is the exact problem the mosaic
   existed to remove. The two small tiles are the exception, because a pair of
   squares side by side only reads as a pair if they are actually the same
   shape. */
.mosaic > .card { margin-bottom: 0; }
/* Square only on a phone, where the pair sits side by side and reads as two
   squares. On a desktop that rule made them 450px tall with a two-digit
   number rattling around inside, so there they stretch to their row. */
.mosaic > .card.sq {
  display: flex; flex-direction: column; justify-content: space-between;
  overflow: hidden;
}
@media (max-width: 899px) { .mosaic > .card.sq { aspect-ratio: 1; } }
/* Three blocks pinned the same way in every square tile: label at the top,
   the number in the middle, the footnote at the bottom. Previously each tile
   let its own content decide, so the two numbers sat at different heights
   and in different sizes, and side by side that reads as a mistake. */
.mosaic > .card.sq .sqmid { margin: auto 0; }
.bignum { white-space: nowrap; }
.bignum.long { font-size: clamp(28px, 8.2vw, 40px); }
.bignum.xlong { font-size: clamp(21px, 6.2vw, 30px); }
.g1 { grid-column: span 1; }
.g2, .g4 { grid-column: span 2; }
@media (min-width: 900px) {
  .mosaic { grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .g1 { grid-column: span 1; }
  .g2 { grid-column: span 2; }
  .g4 { grid-column: span 4; }
}


.tilehead {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  font-size: var(--t-eyebrow); font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
  /* A heading, a badge and a status pill do not always fit across a phone.
     Wrapping between whole elements looks deliberate; the alternative was the
     pills breaking their own text mid-phrase, which looked broken. */
  flex-wrap: wrap; row-gap: 6px;
}
.bignum { font-size: clamp(38px, 11vw, 52px); font-weight: 700; letter-spacing: -.045em; line-height: .92; }
.bigsub { font-size: var(--t-body); font-weight: 600; color: var(--muted); margin-top: 5px; }

/* Real map. OpenStreetMap tiles, no key, attribution kept as required. */
/* Taller now that the legend below it has gone. The map was explaining itself
   twice: once with labelled pins and again with a key underneath. */
.leafmap { height: 252px; width: 100%; background: var(--surface-2); }
@media (min-width: 900px) { .leafmap { height: 210px; } }
.leaflet-container { font: inherit; background: var(--surface-2); }
.leaflet-control-attribution { font-size: 9px !important; background: rgba(255,255,255,.6) !important; }
@media (prefers-color-scheme: dark) {
  .leaflet-control-attribution { background: rgba(0,0,0,.45) !important; color: #9fb0b3 !important; }
  .leaflet-control-attribution a { color: #bcd0d3 !important; }
}
.mapswitch {
  display: flex; gap: 6px; padding: 11px 14px 12px; flex-wrap: wrap;
}
.mapbtn {
  font-size: var(--t-caption); font-weight: 650; padding: 6px 11px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
  transition: border-color .15s, color .15s, background .15s;
}
.mapbtn.on { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
/* Floating on the map rather than in the preset row, where it kept wrapping
   onto a line of its own and looked like an afterthought. */
.mapfab {
  position: absolute; top: 10px; right: 10px; z-index: 500;
  width: 36px; height: 36px; border-radius: 999px;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  border: 1px solid var(--line); color: var(--muted);
  box-shadow: 0 1px 5px rgba(0,0,0,.18);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: color .15s, background .15s;
}
/* Deliberately no active state. It is a toggle between two views, not a thing
   that is on or off, and the icon already says which view a tap would take you
   to. Filling it blue made it look like a selection you were stuck in. */
.mapfab svg { width: 18px; height: 18px; }
/* Yours, not the group's, so it is a quiet outline until you press it. */
.receipt {
  width: 38px; height: 38px; border-radius: 9px; overflow: hidden;
  flex-shrink: 0; background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center;
}
.receipt img { width: 100%; height: 100%; object-fit: cover; display: block; }
.receipt .shim { width: 100%; height: 100%; background: var(--surface-2); }
.receipt.big { width: 100%; height: auto; aspect-ratio: auto; border-radius: 14px; }
.receipt.big img { height: auto; object-fit: contain; }
.shotpreview { width: 46px; height: 46px; border-radius: 9px; object-fit: cover; flex-shrink: 0; }


.hintbar {
  display: flex; align-items: flex-start; gap: 9px; margin: 0 0 12px;
  padding: 11px 13px; border-radius: 13px;
  background: var(--t-sand); color: var(--e-sand);
  font-size: var(--t-body); line-height: 1.45; font-weight: 550;
}
.hintbar svg { flex-shrink: 0; margin-top: 1px; }

.starbtn {
  display: grid; place-items: center; width: 30px; height: 30px;
  border-radius: 999px; color: var(--dim); flex-shrink: 0;
  transition: color .15s, background .15s;
}
.starbtn svg { width: 19px; height: 19px; }
/* Filled, not badged. The star itself is the state. */
.starbtn.on { color: var(--e-sand); }
.starbtn:active { background: var(--surface-2); }

.mpin {
  border-radius: 999px; border: 2.5px solid var(--surface);
  box-shadow: 0 1px 4px rgba(0,0,0,.35);
}
/* Map labels sit on top of whatever the basemap happens to be: pale streets,
   dark streets, or a satellite photo of a mountain. Bare text needed three
   stacked text-shadows to stay readable and still looked pasted on. A small
   opaque pill solves the legibility properly and matches every other chip in
   the app, so the map stops looking like a different product. */
.mlabel {
  font-size: var(--t-eyebrow); font-weight: 700; letter-spacing: .01em; white-space: nowrap;
  color: var(--text); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 8px; box-shadow: 0 1px 5px rgba(0,0,0,.2);
  /* The marker is a zero-size divIcon, so a block child inherits width 0 and
     a background collapses to a blob with the text hanging out of it. Bare
     text never showed this because it had nothing to paint. */
  width: max-content;
}
/* Hangs off the left of its pin instead of the right. The villa and the
   airport are three quarters of an hour apart, which at island zoom is close
   enough that two right-hand labels land on top of each other. */
.mlabel.left { transform: translateX(-100%); margin-left: -16px; }
/* Landmarks are the map talking, not us. A pill is a claim that something is
   one of our places, and six of them on one island was a wall of chips with
   the island somewhere behind it. So these lose the pill entirely and go back to
   text, which is also the honest reason the text-shadow trick exists: it is
   what you do when there is no background to sit on. */
.mlabel.dim {
  color: var(--text); font-weight: 600; opacity: .75;
  background: none; border-color: transparent; box-shadow: none;
  padding: 0;
  text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 4px var(--bg);
}
.smark { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
.infobtn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--t-ui); font-weight: 600; color: var(--accent);
}
/* The row aligns its children on their baselines, but an inline-flex whose
   first child is an icon has no text baseline to offer, so the browser uses
   the icon's bottom edge instead and the whole button hangs a few pixels low.
   Centring this one child sidesteps the rule that causes it. */
.sectionhead .infobtn { align-self: center; }
.infobtn svg { width: 16px; height: 16px; flex-shrink: 0; }

/* Rules is reachable from two places and used to be a dead end from both. */
.backbtn {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--t-body); font-weight: 600; color: var(--accent);
  margin: 4px 0 2px; padding: 6px 2px;
}
.backbtn svg { width: 17px; height: 17px; }
.sectionhead .lhs { display: flex; align-items: center; gap: 9px; }

/* The journey card is a boarding pass, because that is what it is. The notch
   and the tear line do the differentiating that a coloured wash alone cannot. */
.pass .perf {
  border-top: 2px dashed var(--line); margin: 15px -19px; position: relative; height: 0;
}
/* Half a circle, flat side flush with the edge: a bite taken out of the
   ticket rather than a bead threaded onto it. A full circle straddling the
   border had to draw its outer half against whatever sat behind the card, so
   the ring closed on the outside and read as a thing stuck on rather than a
   hole punched through. */
.pass .perf:before, .pass .perf:after {
  content: ""; position: absolute; top: -10px; width: 10px; height: 20px;
  background: var(--bg); border: 1px solid var(--line);
}
.pass .perf:before { left: 0; border-left: none; border-radius: 0 10px 10px 0; }
.pass .perf:after { right: 0; border-right: none; border-radius: 10px 0 0 10px; }

/* Map */
.mapcard { padding: 0; overflow: hidden; position: relative; }
.mapwrap { background: linear-gradient(168deg, var(--t-sky), var(--surface-2)); padding: 18px 14px 10px; }
.mapsvg { width: 100%; height: auto; display: block; overflow: visible; }
@keyframes pulse { 0%,100% { opacity: .3; transform: scale(1); } 50% { opacity: .04; transform: scale(2.1); } }
.pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }

.eyebrow {
  font-size: var(--t-eyebrow); font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px;
}
.sectionhead {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin: 26px 2px 12px;
}
.sectionhead h2 { font-size: var(--t-body); letter-spacing: .01em; }
/* A bare coloured word reads as a label, not a control, and these two are the
   only way into the full flight board. Outlined so they are recognisably
   pressable without competing with the primary buttons below them. */
.act, .sectionhead .act {
  font-size: var(--t-caption); font-weight: 650; color: var(--accent);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 11px; background: var(--surface);
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  transition: background .15s, border-color .15s;
}
.act:active { background: var(--accent-soft); border-color: transparent; }
.act svg { width: 13px; height: 13px; }

.hero { padding: 22px; background: linear-gradient(155deg, var(--surface-2), var(--surface) 62%); }
.hero .big { font-size: clamp(38px, 12vw, 58px); font-weight: 700; letter-spacing: -.045em; line-height: .95; }
.hero .lede { color: var(--muted); font-size: var(--t-body); margin-top: 8px; max-width: 46ch; }

.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: var(--t-body); }
.tiny { font-size: var(--t-caption); }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--t-eyebrow); font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 999px; white-space: nowrap;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
}
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
/* Same shape, sentence case. The uppercase in .pill is right for a two-word
   label and shouting for a line of prose. */
.pill.plain { text-transform: none; letter-spacing: .01em; font-weight: 600; font-size: var(--t-eyebrow); }
.pill.alarm { background: var(--alarm-soft); color: var(--alarm); border-color: transparent; }
.pill.sky { background: var(--sky-soft); color: var(--sky); border-color: transparent; }

.divide { border-top: 1px solid var(--line-soft); margin: 14px 0; }

/* A block of text that is not one of the rows above it: a caution, or a thing
   to remember at a counter.
 *
 * A card that is all small print separated only by font size gives the reader
 * nothing to push against, and every paragraph reads with the same urgency as
 * every other. A surface does what another type size could not: it says this
 * is a different kind of thing, before a word of it has been read.
 *
 * Warnings get the warn tint and nothing else does, so the colour keeps
 * meaning something. */
.note {
  border-radius: 12px; padding: 11px 13px; margin-top: 10px;
  background: var(--surface-2); color: var(--text);
  font-size: var(--t-body); line-height: 1.5;
}
.note.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.note + .note { margin-top: 8px; }

/* The edited mark. Small and grey, because it is a footnote and not an
   accusation, but a real button with a real tap target: 13px of pen with 6px
   of padding around it clears the 24px an adult thumb needs without pushing
   the line it sits on any taller than the text already makes it. */
.penmark {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 5px; margin: -5px 0 -5px -1px; border: 0; background: none;
  color: var(--muted); cursor: pointer; border-radius: 8px; flex-shrink: 0;
}
.penmark:active { background: var(--surface-2); }
.item { padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
.item:last-child { border-bottom: none; padding-bottom: 0; }
.item:first-child { padding-top: 0; }

/* --------------------------------------------------- controls --- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 18px; border-radius: 14px;
  font-size: var(--t-body); font-weight: 650; letter-spacing: -.01em;
  background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
  transition: transform .1s, background .15s, opacity .15s;
  min-height: 46px;
}
.btn:active { transform: scale(.975); }
.btn:disabled { opacity: .42; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--alarm); }
/* The armed state of a two-tap delete. Loud on purpose: it exists for the
   half-second before somebody taps again. */
.btn.sm.danger { border-color: var(--alarm); background: var(--alarm-soft); font-weight: 650; }
.btn.sm { padding: 8px 13px; font-size: var(--t-ui); min-height: 36px; border-radius: 11px; }
/* A segmented row of buttons must not wrap mid-label: it reads as broken.
   Shrink the type before breaking the line. */
.seg { display: flex; gap: 6px; }
.seg .btn { flex: 1 1 0; min-width: 0; white-space: nowrap; padding-left: 6px; padding-right: 6px; }
@media (max-width: 400px) { .seg .btn { font-size: var(--t-caption); } }
.btn.full { width: 100%; }

.input, .select, .textarea {
  width: 100%; padding: 13px 14px;
  background: var(--surface-2); border: 1px solid var(--line);
  /* 16px is not a scale step and must not become one: any smaller and iOS
     zooms the whole page when the field takes focus. */
  border-radius: 13px; font-size: 16px; min-height: 48px;
  transition: border-color .15s;
}
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); }
.textarea { min-height: 74px; resize: vertical; line-height: 1.4; }
/* The trip code is a long run of base64 with nothing in it a person reads.
   Monospaced, and allowed to break anywhere, because it has no spaces to
   break at. The size is left alone on purpose: anything under 16px and iOS
   zooms the page the moment the field takes focus. */
.textarea.code { font-family: var(--mono); line-height: 1.45; word-break: break-all; min-height: 108px; }
.label { display: block; font-size: var(--t-caption); font-weight: 650; color: var(--muted); margin: 0 0 6px 3px; }
.field { margin-bottom: 13px; }
.fieldrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.choice {
  display: flex; align-items: center; gap: 11px;
  padding: 12px 14px; border-radius: 13px;
  border: 1px solid var(--line); background: var(--surface-2);
  font-size: var(--t-body); font-weight: 550; text-align: left; width: 100%;
  transition: border-color .15s, background .15s;
}
.choice.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.choice .tick { margin-left: auto; opacity: 0; }
.choice.on .tick { opacity: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px 7px 7px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface-2);
  font-size: var(--t-ui); font-weight: 600;
}
.chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

/* ------------------------------------------------------ misc ---- */

.bar { height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar i.yes { background: var(--accent); }
.bar i.no { background: var(--alarm); }

.board { display: grid; grid-template-columns: 62px 1fr; gap: 14px; }
.board .t { font-family: var(--mono); font-size: var(--t-lead); font-weight: 600; letter-spacing: -.03em; }
.board .ts { font-size: var(--t-eyebrow); color: var(--dim); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }

.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty .mark { font-size: 30px; opacity: .5; margin-bottom: 10px; }

/* A full page on a phone, a centred card on a desktop.

   As a bottom sheet it spent its whole life fighting the furniture: the
   submit button ended up under the tab bar, the top corners collided with
   the header, and on the installed app the nav bar scrolled with it. A page
   has none of those problems because it owns the screen. */
.sheet {
  position: fixed; inset: 0; z-index: 60;
  display: flex; flex-direction: column;
  background: var(--bg);
}
.sheetwrap { display: flex; flex-direction: column; flex: 1; min-height: 0; width: 100%; }
.sheethead {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--bg); flex-shrink: 0;
}
.sheethead h2 { font-size: var(--t-lead); }
@media (min-width: 700px) {
  .sheet {
    background: color-mix(in srgb, #000 55%, transparent);
    backdrop-filter: blur(3px);
    align-items: center; justify-content: center; padding: 24px;
  }
  .sheetwrap {
    flex: 0 1 auto; max-width: 560px; max-height: 86dvh;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 22px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    animation: rise .22s cubic-bezier(.2,.8,.3,1);
  }
  .sheethead { padding: 18px 18px 14px; }
}
@media (min-width: 700px) { .sheet { align-items: center; } }
.sheetbody {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling: touch;
}
@media (min-width: 700px) { .sheetbody { padding: 18px; } }
@media (min-width: 700px) { .sheetbody { border-radius: 24px; border-bottom: 1px solid var(--line); } }
@keyframes rise { from { transform: translateY(22px); opacity: 0; } }

.lock { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
.lockbox { width: 100%; max-width: 340px; text-align: center; }
.lockbox .mark {
  width: 62px; height: 62px; margin: 0 auto 22px; border-radius: 20px;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-size: 27px; font-weight: 700; letter-spacing: -.04em;
}
/* No background box: this is the emoji from the trip's own facts, drawn by
   whatever font the reader's device has, so nothing is copied and nothing is
   shipped. */
.lockbox .mark.flag { background: none; font-size: 58px; line-height: 1; margin-bottom: 26px; }
.pin {
  text-align: center; font-family: var(--mono); font-size: 26px;
  letter-spacing: .35em; padding: 15px 10px 15px 20px; font-weight: 600;
}

.flash { animation: flash .35s; }
@keyframes flash { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }

.spin { display: inline-block; width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 999px; animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

.voided { opacity: .42; }
.voided .vt { text-decoration: line-through; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 80;
  background: var(--raised); border: 1px solid var(--line);
  border-radius: 999px; padding: 11px 18px; font-size: var(--t-ui); font-weight: 600;
  box-shadow: var(--shadow); animation: rise .2s;
}
@media (min-width: 900px) { .toast { bottom: 28px; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ================= demo build ================= */
/* ------------------------------------------------------------------ *
 * Demo build only. Appended to the app's own stylesheet.
 *
 * Two jobs: paint the tileless map, and keep the demo's own card from
 * looking like something bolted on. Everything else is the app's CSS,
 * untouched.
 * ------------------------------------------------------------------ */

/* The drawn basemap. Colours are set here rather than borrowed from the
   app's tokens because a map wants water and land, and the app has
   neither. Both schemes are written out, and the satellite toggle is a
   second pair rather than a filter. */
.demomap {
  position: relative;
  overflow: hidden;
  --water: #0d1b24;
  --land: #16262d;
  --coast: #27404a;
  --grid: rgba(255, 255, 255, .05);
  background: var(--water);
}
.demomap.sat {
  --water: #061520;
  --land: #1b2a1c;
  --coast: #2c4029;
  --grid: rgba(255, 255, 255, .035);
}
/* Where the photograph does not reach. The mosaic is a fixed box and the
   card is whatever shape the window makes it, so a wide desktop window puts
   a strip of drawn ground down one edge. The drawn ground at this zoom is a
   flat fill with no coastline in it anyway, so it may as well be the fill
   the picture's own edge already is: desert, which is genuinely what is out
   there in both directions. Sampled off the edge tiles. Its own value for
   each scheme, because the picture is dimmed with a filter in the dark one
   and a background colour would not be. */
.demomap.shot { --water: #9f917b; --land: #9f917b; --coast: #9f917b; --grid: transparent; }
@media (prefers-color-scheme: light) {
  .demomap {
    --water: #d7e6ef;
    --land: #eef1e9;
    --coast: #c6d3c8;
    --grid: rgba(0, 0, 0, .05);
  }
  .demomap.sat {
    --water: #b4cddc;
    --land: #ccd6bd;
    --coast: #b3c0a2;
    --grid: rgba(0, 0, 0, .04);
  }
  .demomap.shot { --water: #e0caa5; --land: #e0caa5; --coast: #e0caa5; --grid: transparent; }
}

.demomap-ground,
.demomap-lines {
  position: absolute;
  inset: 0;
  display: block;
  pointer-events: none;
}
.demomap-pins { position: absolute; inset: 0; pointer-events: none; }

/* Each pin is a zero-size anchor; the app's own .mpin and .mlabel do the
   drawing, exactly as they do under Leaflet. */
.demopin { position: absolute; width: 0; height: 0; }
.demopin > * { position: absolute; }

.demoland { fill: var(--land); stroke: var(--coast); stroke-width: .6; }
.demogrid { stroke: var(--grid); stroke-width: .5; }

/* The Landsat tiles. Clipped to the card, because the mosaic is a fixed box
   and the card is whatever shape the window makes it, so at a wide window
   the picture runs past both ends. */
.demomap-photo { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.demomap-photo[hidden] { display: none; }
.demomap-photo img { position: absolute; display: block; }
/* Daylight satellite imagery is bright, and the app around it at night is
   not. Dimmed rather than recoloured: the point of a photograph is that it
   is the real ground, and a blue-filtered Nile stops being that. */
@media (prefers-color-scheme: dark) {
  .demomap-photo img { filter: brightness(.72) saturate(.85); }
}

.demomap-credit {
  position: absolute;
  right: 0;
  bottom: 0;
  padding: 1px 5px;
  border-radius: 4px 0 0 0;
  pointer-events: none;
}

/* A phone has an overlay scrollbar; a desktop browser showing this in a
   320px iframe has a real one, and it takes fifteen of those pixels off
   every screen in the app. Hidden here and nowhere else: on the phones the
   app is actually built for, this rule changes nothing. */
.scroll { scrollbar-width: none; }
.scroll::-webkit-scrollbar { width: 0; height: 0; }

/* The demo's banner used to live here. It is gone: the page around the phone
   already says what this is, and repeating it cost a quarter of the first
   screen. What is left of owning up to itself is on the settings screen. */

/* The globe button, kept inside its own card.
 *
 * .mapfab carries z-index 500, which is a Leaflet-scale number: under real
 * Leaflet it is measured against Leaflet's own panes and never leaves the
 * map. The shim has no panes, and nothing between the button and the root
 * makes a stacking context, so the 500 was measured against the whole page
 * and beat the sheets at 60 and the top bar at 20. Opening "Show the trip as"
 * put a globe on top of the sheet, next to "In Cairo".
 *
 * Isolating the card gives the 500 something local to be big inside. Lowering
 * the button's own z-index would fix this one symptom; this fixes anything
 * else that ever lands in that card with a number meant for another world. */
.mapcard { isolation: isolate; }
</style>

 * The trip, and the handful of things about the app that change with

 *
 * Nothing in here names a destination. These are the fallbacks used

const TRIP_FALLBACK = {
  start: "",
  end: "",
  where: "",
  /* Written before the number rather than after it. That is not what a
     German locale does with a currency on its own, but it is what every
     screen here has always shown and what the assistant is told to
     match, so the two never disagree on the same figure. */
  symbol: "€",
  /* Which digit grouping the amounts use, independently of the language
     the interface is in. The setup wizard sets this per trip; until one
     exists, the inherited default stands. */
  moneyLocale: "de-DE",
  /* [[south, west], [north, east]] for the wide map view. Null means
     work it out from whatever the trip has coordinates for, which is
     the right answer for almost every trip. Set it explicitly when the
     frame should be wider than the pins, the way an island is. */

     relative to us" instead of showing two dots in a sea of nothing.
     Public geography, never anything about where the group is staying. */
  landmarks: [],
  /* What the app calls itself: the browser tab, the notification that
     proves notifications work, the name on an exported record. */
  appName: "Trip",
  /* One character standing in for the whole trip: a flag, a boat, a wine
     glass. It is the mark on the lock screen and the obvious source for a
     home screen icon later. Rendered as text, so it is drawn by whatever
     emoji font the device has. */
  emoji: "🧳",
  /* The destination as prose, and the town people actually leave from
     when they drive to the airport. "In <place>", "leave <hub>".
     Either may be a plain string, or an object keyed by language for
     the names that genuinely differ: some places have a different name
     per language, and most towns are the same word in every mouth. */
  place: "",
  hub: ""
};
let TRIP = {
  ...TRIP_FALLBACK
};

/* The two place names in the language being read. Module-level and set
   next to LOCALE, for the same reason: the copy below is a plain object
   and threading a language through every string in it buys nothing. */
let PLACE = "";
let HUB = "";

/* The admin's name, from the trip once it arrives. Copy that names the
   admin reads it from here, so the committed file never carries a name. */
let ADMIN_NAME = "Admin";

/* Accepts a plain string, or { de: "Kopenhagen", en: "Copenhagen" } when it matters. */
function inLang(v, lang) {
  if (!v) return "";
  if (typeof v === "string") return v;
  return v[lang] || v.en || Object.values(v)[0] || "";
}

/* Most copy below is a plain string. The few lines that have to name the
   trip's own destination are functions instead, because the destination is
   not known when this file is parsed. Read either kind through here. */
const say = (v, ...args) => typeof v === "function" ? v(...args) : v;

/* Called from derive(), which is the single funnel every piece of store
   data passes through, so this has always landed before anything renders. */
function applyTrip(trip) {
  const t = trip || {};
  TRIP = {
    start: t.start || TRIP_FALLBACK.start,
    end: t.end || TRIP_FALLBACK.end,
    where: t.where || TRIP_FALLBACK.where,
    symbol: t.currencySymbol || TRIP_FALLBACK.symbol,
    moneyLocale: t.moneyLocale || TRIP_FALLBACK.moneyLocale,
    bounds: t.bounds || TRIP_FALLBACK.bounds,
    landmarks: t.landmarks || TRIP_FALLBACK.landmarks,
    appName: t.appName || TRIP_FALLBACK.appName,
    emoji: t.emoji || TRIP_FALLBACK.emoji,
    place: t.place || TRIP_FALLBACK.place,
    hub: t.hub || TRIP_FALLBACK.hub
  };
  const adminP = (t.people || []).find(p => p.id === t.adminIs);
  ADMIN_NAME = adminP && adminP.name || "Admin";
}

/* ================================================================== *
 * How people get there.
 *
 * Everything here used to be spelled "flight", and not as a label: the
 * notifications fired on check-in windows, the clustering that decides who
 * shares a car was built on landing times, and the map drew great circles
 * between airport codes. A flight is one way of arriving. The friend who
 * lives in the town you are all visiting is not going to book one.
 *
 * A mode belongs to a LEG rather than to a person, because flying out and
 * taking the ferry home is an ordinary thing to do and a person-level field
 * cannot say it. The builder offers one toggle per person because that is
 * what almost everybody wants; the record allows both.
 *
 * A leg with no mode at all is a flight. Every leg written before this
 * existed is like that, including the ones six people are flying with in
 * September, and nothing is ever written back into an old record to say so.
 * ================================================================== */

/* What a mode implies, which is the only thing the screens care about:
 *   hub     arrives somewhere a car has to be sent to
 *   timed   has times worth printing rather than "some time on Tuesday"
 *   checkIn has something to check into the day before
 *   ident   carries a number worth showing, like a flight or a sailing
 */
const MODE_TRAITS = {
  plane: {
    icon: "\u2708\ufe0f",
    hub: true,
    timed: true,
    checkIn: true,
    ident: true
  },
  train: {
    icon: "\ud83d\ude86",
    hub: true,
    timed: true,
    checkIn: false,
    ident: true
  },
  boat: {
    icon: "\u26f4\ufe0f",
    hub: true,
    timed: true,
    checkIn: true,
    ident: true
  },
  car: {
    icon: "\ud83d\ude97",
    hub: false,
    timed: true,
    checkIn: false,
    ident: false
  },
  bike: {
    icon: "\ud83d\udeb2",
    hub: false,
    timed: false,
    checkIn: false,
    ident: false
  },
  foot: {
    icon: "\ud83d\udeb6",
    hub: false,
    timed: false,
    checkIn: false,
    ident: false
  },
  none: {
    icon: "\ud83c\udfe0",
    hub: false,
    timed: false,
    checkIn: false,
    ident: false
  }
};
const legMode = leg => {
  const m = leg && typeof leg.mode === "string" ? leg.mode : "plane";
  return MODE_TRAITS[m] ? m : "plane";
};
const modeTraits = leg => MODE_TRAITS[legMode(leg)];
/* Somebody who is already there has no journey at all, which is different
   from somebody whose journey nobody has filled in yet. */
const travels = leg => legMode(leg) !== "none";

/* Most trips really are all flights, and calling the tab "Journeys" for
   those would be vaguer for no gain. So it only widens when it has to. */
const allFlights = people => (people || []).every(p => legMode(p.out) === "plane" && legMode(p.back) === "plane");

/* ================================================================== *
 * Bringing a trip in from the builder on the site.
 *
 * The builder speaks its own vocabulary, because it was written to be
 * filled in by a person and this was written to be read by screens. The
 * translation lives HERE, on the receiving side, deliberately: a copy of
 * this app can be years older than the page that produced the code, and
 * the one that has to cope is the one being handed something it did not
 * write. Anything unrecognised is dropped rather than stored, so a
 * newer builder never poisons an older store.
 * ================================================================== */

/* A Map rather than an object, because an object is also a lookup into
   Object.prototype: a currency of "constructor" came back truthy and the
   symbol and locale then read as undefined off a function. It degraded to
   the euro rather than breaking, which is the kind of bug that survives. */
const MONEY = new Map([["EUR", ["\u20ac", "de-DE"]], ["USD", ["$", "en-US"]], ["GBP", ["\u00a3", "en-GB"]], ["CHF", ["CHF ", "de-CH"]], ["SEK", ["kr ", "sv-SE"]], ["NOK", ["kr ", "nb-NO"]], ["DKK", ["kr ", "da-DK"]], ["PLN", ["z\u0142 ", "pl-PL"]], ["CZK", ["K\u010d ", "cs-CZ"]], ["JPY", ["\u00a5", "ja-JP"]], ["CAD", ["$", "en-CA"]], ["AUD", ["$", "en-AU"]]]);

/* What this copy of the app knows how to read. The builder stamps the same
   number into every code it makes.

   Raised to 2 when modes of travel landed, and that is exactly the case the
   number exists for: a v1 app reading a v2 code would find a leg with times
   and a place, see no mode because it has never heard of one, and conclude
   flight. It would then tell somebody driving to Berlin that their online
   check-in is open. Refusing with a sentence is better. */
const TRIP_CODE_VERSION = 2;

/* base64url in, builder trip out. Throws with something sayable. */
function decodeTripCode(raw) {
  const clean = String(raw || "").trim().replace(/\s+/g, "");
  if (!clean) throw new Error("empty");
  let parsed;
  try {
    const b64 = clean.replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    parsed = JSON.parse(new TextDecoder().decode(bytes));
  } catch {
    throw new Error("unreadable");
  }
  if (!parsed || !parsed.trip || !Array.isArray(parsed.trip.people)) throw new Error("unreadable");
  /* A code from a builder newer than this copy of the app is refused rather
     than half-imported. Anything this old reader silently dropped would look
     like the builder having lost it, and the person would have no way to tell
     which of the two was wrong. Older codes are fine: they carry less, and
     everything here treats missing as missing. */
  if (typeof parsed.v === "number" && parsed.v > TRIP_CODE_VERSION) throw new Error("newer");
  return parsed.trip;
}

/* The builder's trip, in this app's own words. `adminIs` is not guessed:
   it is asked for, because naming the wrong person as admin locks the
   real one out of their own trip. */
function tripFromBuilder(b, adminIs) {
  const people = (b.people || []).filter(p => p && p.id && p.name);
  if (!people.length) throw new Error("unreadable");

  /* "Cairo, Egypt" is the label a search box returns. Screens want the
     town on its own, which is the half before the comma. */
  const short = v => String(v || "").split(",")[0].trim();
  const money = MONEY.get(b.currency) || MONEY.get("EUR");
  const dest = b.destination || {};
  const place = short(dest.label);

  /* The airport everyone is flying into, by majority of the outbound
     legs, because that is the one the transfer runs are built around. */
  const seen = {};
  for (const p of people) if (p.out && p.out.toCode) seen[p.out.toCode] = (seen[p.out.toCode] || 0) + 1;
  const code = Object.keys(seen).sort((x, y) => seen[y] - seen[x])[0] || "";

  /* Explicit fields, so nothing the builder happens to be carrying ends up
     in the record uninvited. Which means every new field has to be added
     here as well, and the first one that was not is the reason this comment
     exists: modes travelled the whole way from the toggle to the code and
     were dropped on the doorstep, silently, leaving everybody flying.
      A leg counts as real if it has a mode, not only if it has times. A
     bicycle has no departure time and is still how somebody is getting
     there, and "already there" is a fact worth keeping rather than an
     absence. */
  const leg = l => {
    if (!l) return undefined;
    const has = l.mode || l.flight || l.depart || l.arrive || l.from || l.to;
    if (!has) return undefined;
    const out = {
      flight: l.flight || "",
      airline: l.airline || "",
      fromCode: l.fromCode || "",
      toCode: l.toCode || "",
      depart: l.depart || "",
      arrive: l.arrive || ""
    };
    if (typeof l.mode === "string") out.mode = l.mode;
    if (l.from) out.from = String(l.from);
    if (l.to) out.to = String(l.to);
    /* The clocks the builder worked out, and the day if the leg has one of
       its own. Same rule as the mode: a field that is not named here does not
       arrive, and the first one that was not is why this list is written out
       rather than spread. */
    if (typeof l.tzOffset === "number") out.tzOffset = l.tzOffset;
    if (typeof l.tzOffsetArrive === "number") out.tzOffsetArrive = l.tzOffsetArrive;
    if (typeof l.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(l.date)) out.date = l.date;
    return out;
  };
  const trip = {
    appName: b.name || "Trip",
    emoji: b.emoji || "\ud83e\uddf3",
    start: b.start || "",
    end: b.end || "",
    where: place,
    place,
    hub: place,
    currencySymbol: money[0],
    moneyLocale: money[1],
    adminIs: adminIs || people[0].id,
    /* Everyone arrives with their own face, so nothing is claimed and the
       pool stays empty. The picker only appears for a trip that has one. */
    avatars: [],
    people: people.map(p => {
      const one = {
        id: p.id,
        name: p.name
      };
      if (p.colour) one.colour = p.colour;
      if (p.emoji) one.emoji = p.emoji;
      if (leg(p.out)) one.out = leg(p.out);
      if (leg(p.back)) one.back = leg(p.back);
      return one;
    })
  };

  /* The icon's colour rides along so the home screen can be drawn from
     the trip rather than from a file somebody has to replace. */
  if (b.iconColour) trip.iconColour = b.iconColour;

  /* The fallback clocks, for anything with no leg to ask. */
  const tz = {};
  if (b.tz && typeof b.tz.home === "number") tz.home = b.tz.home;
  if (b.tz && typeof b.tz.there === "number") tz.there = b.tz.there;
  if (Object.keys(tz).length) trip.tz = tz;

  /* The airports the builder actually used, with coordinates, because this
     app has no way to look a code up: it is one HTML file and the list is
     four thousand rows. Without it the journey map draws nothing, which is
     what it did until this was noticed. Validated rather than trusted, so a
     hand-edited code cannot put junk into the record. */
  const places = {};
  for (const [code_, v] of Object.entries(b.airports || {})) {
    if (typeof code_ !== "string" || !code_ || !v) continue;
    if (typeof v.lat !== "number" || typeof v.lon !== "number") continue;
    places[code_] = {
      name: String(v.name || code_),
      lat: v.lat,
      lon: v.lon
    };
  }
  if (Object.keys(places).length) trip.airports = places;

  /* The destination airport's own coordinates when we have them. The
     destination's are the town's, and the drive to the airport is measured
     from one to the other, so using the town for both made it zero. */
  if (code && places[code]) trip.airport = {
    code,
    ...places[code]
  };else if (code && dest.lat != null && dest.lon != null) trip.airport = {
    code,
    name: place,
    lat: dest.lat,
    lon: dest.lon
  };
  const lod = b.lodging || {};
  if (lod.name) {
    trip.villa = {
      name: lod.name,
      bookedBy: trip.adminIs
    };
    if (lod.lat != null) trip.villa.lat = lod.lat;
    if (lod.lon != null) trip.villa.lon = lod.lon;
    if (lod.nights != null) trip.villa.nights = lod.nights;
    if (lod.total != null) trip.villa.total = lod.total;
  }
  const cars = (b.cars || []).filter(c => c && c.label);
  if (cars.length) trip.cars = cars.map(c => ({
    label: c.label,
    price: c.price || 0,
    seats: c.seats || 0
  }));
  return trip;
}

/* ==================================================================== *
 * The demo trip.
 *
 * Every name, price, flight and opinion below is invented. Nothing here
 * comes from seed.local.json, from the Blob store, or from any file the
 * repository does not carry, and nothing here describes a real journey
 * anybody has taken. That is the whole point of the file: the portfolio
 * build has to be able to show the app working without showing anyone's
 * holiday.
 *
 * Built as a function of `now` rather than as a constant, because a
 * demo is read at an unknown date and everything in it is relative:
 * a vote closes in fourteen hours, an expense was entered last Tuesday.
 * Absolute timestamps would rot within a week of the build.
 *
 * The trip is Nile Week, Cairo, four people, and it always starts twelve
 * days from whenever this is read. The record below is what a group about
 * to leave would have: the lodging paid and mostly settled up, the minibus
 * paid, tickets bought, a shopping list mostly unticked, two live votes and
 * one already settled.
 * ==================================================================== */

/* The trip's own dates, computed on every load rather than written down.
   Always twelve days out, always the same seven nights, so the countdown
   reads twelve whenever the showcase is opened and the trip is always about
   to happen.
   This used to run the other way round: fixed dates in June 2027 and a demo
   clock that moved "now" back to meet them. Same reading inside the phone,
   but the showcase quotes the trip's dates on the page beside it, so a
   visitor saw a twelve day countdown next to a week ten months away. Moving
   the trip is the honest half of that pair, and it is only possible now the
   trip is data the seed supplies rather than something typed into the app. */
const DEMO_LEAD_DAYS = 12;
const DEMO_NIGHTS = 7;
const demoIsoDay = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

/* Local midnight, not UTC: the trip's dates are dates, and a visitor in
   Auckland reading a UTC day boundary would see the countdown off by one. */
const demoTripDate = n => {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + DEMO_LEAD_DAYS + n);
  return d;
};
const demoTripDay = n => demoIsoDay(demoTripDate(n));
const DEMO_START = demoTripDay(0);
const DEMO_END = demoTripDay(DEMO_NIGHTS);

/* Anything in the seed that names a day of the week has to be told which one
   it is now, because it is no longer the same day twice running. */
const DEMO_WEEKDAY_EN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const DEMO_WEEKDAY_DE = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
/* The felucca is the evening before the last one, and three separate strings
   have to agree about which evening that is. */
const DEMO_FELUCCA = demoTripDate(DEMO_NIGHTS - 2).getDay();
const FELUCCA_EN = DEMO_WEEKDAY_EN[DEMO_FELUCCA];
const FELUCCA_DE = DEMO_WEEKDAY_DE[DEMO_FELUCCA];

/* An emoji as a picture.
 *
 * The app's avatar takes an image, and this build must not reach for a file,
 * so the glyph is drawn into an SVG data URI out of whatever emoji font the
 * device already has. About a hundred and fifty bytes, sharp at any size,
 * and nothing to load.
 *
 * Deliberately not an action in the log: the log records what people did, and
 * in this app choosing a picture is not something anybody can do yet. It is a
 * fact about the person, so it sits on the person. Leave `emoji` off and the
 * app falls back to initials on their colour, exactly as it does for anybody
 * who has not got one. */
const demoFace = emoji => !emoji ? undefined : "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">' + '<text x="20" y="20" font-size="23" text-anchor="middle" dominant-baseline="central">' + emoji + "</text></svg>");
function demoSeed(now) {
  const hour = 3600000;
  const day = 86400000;
  /* Read as "this happened n days ago". Kept slightly ragged rather than
     landing every entry on the same minute, which is what a log written by
     four people over three weeks actually looks like. */
  const ago = (days, hours) => now - days * day - (hours || 0) * hour;

  /* ---------------------------------------------------------- people --- */
  /* Four people, four cities, one arrival airport. Milo lands first and
     flies out last, which is why they are the one holding the minibus: the
     driver board and the transfer runs are both derived from exactly that.
      The flight codes are three letters on purpose. Real flight numbers are
     two, so nothing below can be mistaken for a bookable flight, and the
     airlines are invented outright. */
  const people = [{
    id: "noa",
    name: "Noa",
    from: "Zurich",
    colour: "#3d95e8",
    emoji: "🦊",
    out: {

  /* ------------------------------------------------------- geography --- */

     and the only coordinates in the file other than the invented house. */

    /* Cairo, and not much more than Cairo. This box used to hold the delta

/* ==================================================================== *
 * The demo runtime.
 *
 * Injected into the app just before it renders, and nowhere else. It
 * replaces the four things that talk to the outside world:
 *
 *   the store        /api/trip   ->  an action log in localStorage
 *   the assistant    /api/ask    ->  a sentence saying it needs a key
 *   the receipts     /api/photo  ->  the data URI, kept in the log
 *   the basemap      tile server ->  coastlines drawn from embedded data
 *
 * Everything else is the real app, unaltered: the same derivation, the
 * same settlement maths, the same components. That is deliberate. A demo
 * that reimplements the screens is a demo of the demo.
 *
 * There is no network path out of this file. No fetch, no XHR, no
 * WebSocket, no image or font from anywhere but this document.
 * ==================================================================== */

const DEMO_ASK_EN = "The assistant is switched off in this demo. It answers by calling a model with an API key, " + "and the key belongs on a server this build does not have. In the real app the question and " + "the answer both land in the record below, where the whole group can see them.";
const DEMO_ASK_DE = "Der Assistent ist in dieser Demo aus. Er antwortet, indem er ein Modell mit einem " + "API-Schlüssel aufruft, und der Schlüssel gehört auf einen Server, den dieser Build nicht hat. " + "In der echten App landen Frage und Antwort beide im Protokoll darunter, für die ganze Gruppe sichtbar.";
const DEMO_MAP_CREDIT = "Natural Earth · demo, no tiles";

/* ------------------------------------------------------------------ *
 * The demo clock, and why there is not one any more.
 *
 * There used to be: the trip had fixed dates in June 2027 and this file
 * subclassed Date so that "now" was always twelve days before them. It
 * worked, and it was the wrong way round. The showcase quotes the trip on
 * the page next to the phone, so a visitor read a twelve day countdown
 * beside a week ten months away.
 *
 * The trip is data the seed supplies now, not something typed into the
 * app, so the seed moves the trip instead: it starts twelve days from
 * whenever this is read. Everything the shifted clock used to buy comes
 * for free from that, and the real time of day is genuinely the real time
 * of day rather than a reconstruction of it.
 * ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ *
 * A map without tiles.
 *
 * The app draws its map through Leaflet, and Leaflet draws the ground
 * with raster tiles from a CDN. The tiles are the only part that cannot
 * come along, so this is a Leaflet-shaped object big enough for exactly
 * what TripMap asks of it: a projection, markers, dashed lines between
 * them, and a frame that fits given bounds.
 *
 * The ground underneath comes from Natural Earth's 110m land polygons,
 * decoded at build time and embedded as DEMO_LAND. Coarse, public
 * domain, and small: enough to recognise the eastern Mediterranean and
 * the Atlantic, which is what the journey view is actually about.
 * Nothing exists at street scale, so the local view draws a graticule
 * and a credit line that says what it is rather than pretending.
 * ------------------------------------------------------------------ */

(function installMapShim() {
  const clamp = lat => Math.max(-85, Math.min(85, lat));

  /* Web Mercator, normalised to the unit square, which is all that is
     needed: everything below works in ratios and only turns into pixels
     at the last step. */
  const px = lon => (lon + 180) / 360;
  const py = lat => {
    const s = Math.sin(clamp(lat) * Math.PI / 180);
    return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
  };

  /* Points arrive as {lat, lng}, as {lat, lon}, or as [lat, lon], because
     that is how the app writes them. */
  const pt = p => {
    if (Array.isArray(p)) return {
      lat: +p[0],
      lng: +p[1]
    };
    if (p && typeof p === "object") return {
      lat: +p.lat,
      lng: +(p.lng != null ? p.lng : p.lon)
    };
    return {
      lat: 0,
      lng: 0
    };
  };
  function Bounds(points) {
    const list = (points || []).map(pt).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
    const lats = list.map(p => p.lat);
